# Demo profile dành cho môi trường deploy demo.
# Chỉ thêm seed demo mới (db/demo), KHÔNG dùng db/seed của dev để tránh
# Flyway validation thiếu V2..V35 trên DB được khởi tạo bằng profile prod.
spring:
  config:
    activate:
      on-profile: demo
  flyway:
    locations: classpath:db/migration,classpath:db/demo
    # Chỉ cho phép clean khi profile demo; bean DemoDatabaseResetConfig chỉ
    # gọi clean nếu APP_DEMO_RESET_ON_START=true.
    clean-disabled: false

app:
  demo:
    reset-on-start: ${DEMO_RESET_ON_START:false}

payment:
  demo:
    skip-enabled: true
