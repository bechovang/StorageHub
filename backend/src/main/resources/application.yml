# ============================================================================
# StorageHub backend — cấu hình chung (mọi profile)
# Secrets qua env vars, không commit (arch spine — Sensitive & secrets)
# AD-6: Flyway owns schema — hibernate chỉ validate, cấm auto DDL
# AD-7: timestamp lưu UTC; ngày nghiệp vụ DATE theo lịch ICT (quy đổi service)
# ============================================================================

spring:
  config:
    # Tự đọc backend/.env (KEY=VALUE) khi dev — env var của OS vẫn ưu tiên.
    import: optional:file:./.env[.properties]
  application:
    name: storagehub
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:storagehub}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&connectionTimeZone=UTC
    username: ${DB_USER:root}
    password: ${DB_PASS:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health   # health check duy nhất (arch spine Deferred)

# ----------------------------------------------------------------------------
# JWT (AD-5) — secret là Base64, tạo bằng PowerShell, load từ env
# ----------------------------------------------------------------------------
security:
  jwt:
    secret: ${JWT_SECRET}
    ttl: PT24H

# ----------------------------------------------------------------------------
# CARD/MOMO/VNPAY = demo: tạo payment → PROCESSING → poll tự SUCCEEDED
# (auto-complete-delay 0s). PAYOS = thật, bật bằng PAYOS_ENABLED + 3 key.
# Test values cũ trong contract chỉ còn giá trị lịch sử.
# ----------------------------------------------------------------------------
payment:
  mock:
    auto-complete-delay: PT0S

  # PayOS thật (AD-9/Task 33):
  #   PAYOS_ENABLED=true
  #   PAYOS_CLIENT_ID / PAYOS_API_KEY / PAYOS_CHECKSUM_KEY
  # Webhook URL trên dashboard PayOS:
  #   https://<tunnel>/api/v1/payments/webhooks/payos
  payos:
    enabled: ${PAYOS_ENABLED:false}
    return-url: ${PAYOS_RETURN_URL:http://localhost:5173/payment}
    cancel-url: ${PAYOS_CANCEL_URL:http://localhost:5173/payment}
    client-id: ${PAYOS_CLIENT_ID:}
    api-key: ${PAYOS_API_KEY:}
    checksum-key: ${PAYOS_CHECKSUM_KEY:}
    # orderCode = base + paymentId (hàm thuần, webhook suy ngược được).
    order-code-base: 100000
    qr-ttl: PT5M
# springdoc render docs từ code — chỉ để tham khảo; contract thật =
# contracts/openapi.yaml (AD-2)

---

# ----------------------------------------------------------------------------
# profile dev: thêm seed demo (V2__seed_demo) — tái lập mock chuẩn từ 0
# ----------------------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: dev
  flyway:
    locations: classpath:db/migration,classpath:db/seed
    validate-on-migrate: false
