# ============================================================================
# StorageHub API — Sprint 1 contract (FROZEN 2026-09-22)
# Nguồn chân lý DUY NHẤT của API (AD-2). Muốn đổi API: PR vào file này trước,
# code sau. Endpoint ngoài Sprint 1 KHÔNG khai báo ở đây — mỗi sprint đóng băng
# riêng. FE phát triển chống MSW sinh từ file này; BE endpoint phải khớp.
#
# Quy ước xuyên suốt (không lặp lại ở từng endpoint):
# - AD-5: JWT Bearer (TTL 24h, không refresh). Đúng 3 endpoint public:
#   POST /auth/login, POST /auth/register, POST /auth/forgot-password.
# - AD-7: Tiền VND = JSON number nguyên (đồng), không float. Ngày nghiệp vụ
#   (business date) = chuỗi "YYYY-MM-DD" ngữ nghĩa ICT; timestamp = ISO-8601
#   kèm offset (UTC khi lưu).
# - AD-8: Mọi lỗi theo envelope Error (machine code + message + fieldErrors).
#   Danh sách theo envelope page {items, page, pageSize, total}, page 1-based,
#   mặc định 25. Enum UPPER_SNAKE; JSON field camelCase; query param kebab-case.
# - AD-9: CARD/MOMO/VNPAY = mock demo; PAYOS = cổng thật; outcome không bao
#   giờ là field trong request.
# - AD-11: Mọi con số tiền sinh từ PricingEngine; quote snapshot vào
#   reservation tại Booking Summary; contract dùng lại snapshot.
# - 401/403 từ tầng security vẫn trả envelope Error (AuthenticationEntryPoint /
#   AccessDeniedHandler).
# - Mọi operation đều CÓ THỂ trả 500 INTERNAL_ERROR theo cùng envelope Error
#   (fallback chưa-được-liệt-kê) — không lặp lại 500 ở từng operation.
# ============================================================================
openapi: 3.0.3
info:
  title: StorageHub API
  version: 1.0.0-sprint1
  description: |
    REST API cho StorageHub (SWP391) — Sprint 1: 22/09–05/10/2026.

    Phạm vi Sprint 1 (13 US): auth + adaptive shell (US-4/5), browse units với
    availability chính xác (US-6), unit detail + bảng giá (US-7), booking
    summary + reserve re-check (US-9), payment modal + mock gateway (US-8),
    reservation lifecycle + EXPIRED no-show on-read (US-10), contract
    auto-draft + chain (US-11/13), my rentals + check-in pass (US-12).

    Health check ngoài contract này: GET /actuator/health (không JWT).
servers:
  - url: /api/v1
    description: Same-origin (Vite dev proxy /api → Boot :8080)

security:
  - bearerAuth: []

tags:
  - name: Auth
  - name: Units
  - name: Reservations
  - name: Payments
  - name: Contracts
  - name: Tasks
  - name: Notifications
  - name: Facility
  - name: ActivityLogs
  - name: Shifts

# ---------------------------------------------------------------------------
paths:

  # ----------------------------- AUTH (AD-5) ------------------------------

  /auth/login:
    post:
      tags: [Auth]
      summary: Đăng nhập (public) — ghi ActivityLog LOGIN/LOGIN_FAILED (FR-38)
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password, minLength: 6 }
            example: { email: "lan@demo.vn", password: "secret123" }
      responses:
        "200":
          description: Phiên đăng nhập hợp lệ; landingRoute theo role
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
              example:
                token: "eyJhbGciOiJIUzI1NiJ9..."
                expiresAt: "2026-09-23T08:00:00Z"
                user:
                  id: 10
                  fullName: "Lan Nguyen"
                  email: "lan@demo.vn"
                  phone: "0901234567"
                  role: CUSTOMER
                landingRoute: /browse
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Sai email/mật khẩu — message chung, không tiết lộ field nào sai
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: AUTH_INVALID_CREDENTIALS, message: "Email hoặc mật khẩu không đúng. Thử lại hoặc dùng quên mật khẩu.", fieldErrors: [] }
        "423":
          description: |
            Tài khoản deactivate/lock. Chỉ trả SAU khi mật khẩu đã đúng — không
            phải vector enumeration email (phải có credential hợp lệ mới thấy
            khác biệt so với 401). Giữ mã riêng để user bị khóa hiểu cần liên
            hệ quản trị thay vì thử đổi mật khẩu.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: AUTH_ACCOUNT_LOCKED, message: "Tài khoản hiện không đăng nhập được. Liên hệ quản trị hệ thống.", fieldErrors: [] }

  /auth/register:
    post:
      tags: [Auth]
      summary: Tự đăng ký tài khoản CUSTOMER (public) — không có trường role (FR-2)
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, phone, email, password, agreeTerms]
              properties:
                fullName: { type: string, maxLength: 100 }
                phone: { type: string, maxLength: 20 }
                email: { type: string, format: email }
                password: { type: string, format: password, minLength: 6 }
                agreeTerms: { type: boolean, enum: [true] }
            example: { fullName: "Lan Nguyen", phone: "0901234567", email: "lan@demo.vn", password: "secret123", agreeTerms: true }
      responses:
        "201":
          description: Tạo xong + đăng nhập luôn (rơi vào Browse Units đã đăng nhập)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: Email đã tồn tại — chặn, FE báo inline ngay tại form
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: AUTH_EMAIL_EXISTS, message: "Email này đã có tài khoản. Đăng nhập hoặc dùng quên mật khẩu.", fieldErrors: [{ field: email, code: TAKEN, message: "Email đã được dùng" }] }

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Quên mật khẩu (public) — stub, không gửi email thật (FR-3)
      description: Luôn trả 200 với message generic dù email có tồn tại hay không.
      operationId: forgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200":
          description: Xác nhận generic
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Nếu email này tồn tại, hướng dẫn đặt lại mật khẩu đã được gửi." }
        "400": { $ref: "#/components/responses/BadRequest" }

  /auth/me:
    get:
      tags: [Auth]
      summary: Profile + role + landing route của token hiện tại (boot shell)
      operationId: getMe
      responses:
        "200":
          description: Thông tin user của token
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/UserSummary"
                  - type: object
                    properties:
                      landingRoute: { type: string, example: /browse }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ----------------------------- UNITS (US-6/7) ---------------------------

  /units/filter-options:
    get:
      tags: [Units]
      summary: Giá trị cho filter bar Browse Units (loại + kích thước có sẵn)
      operationId: getUnitFilterOptions
      responses:
        "200":
          description: Danh mục loại unit + các size đang có (làm dropdown filter)
          content:
            application/json:
              schema:
                type: object
                properties:
                  types:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer, format: int64 }
                        name: { type: string, example: Indoor }
                  sizesM2:
                    type: array
                    items: { type: number, example: 5 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /units:
    get:
      tags: [Units]
      summary: Tìm kho — availability tính tại thời điểm query (FR-4, AD-4)
      description: |
        Loại trừ Unit Rented / Maintenance / Retired khỏi kết quả.
        Availability = Reservation + Turnover Buffer (Policy Rule active),
        tính on-read phía server; card buffer trả status AVAILABLE_SOON kèm
        availableFromDate — vẫn đặt được với ngày đó.
        Chỉ re-query khi FE bấm Search (không per keystroke) — việc đó của FE,
        contract chỉ cung cấp endpoint idempotent.
        Yêu cầu đăng nhập (AD-5: đúng 3 endpoint public — browse không nằm
        trong số đó).
      operationId: searchUnits
      parameters:
        - { name: type-id, in: query, schema: { type: integer, format: int64 }, description: "Lọc theo loại unit (id từ /units/filter-options)" }
        - { name: size-m2, in: query, schema: { type: number }, description: "Lọc đúng kích thước (m²), vd 5" }
        - { name: start-date, in: query, schema: { type: string, format: date }, description: "Ngày bắt đầu thuê dự kiến (YYYY-MM-DD)" }
        - { name: end-date, in: query, schema: { type: string, format: date }, description: "Ngày trả kho (inclusive)" }
        - { name: sort, in: query, schema: { type: string, enum: [price-asc, price-desc], default: price-asc }, description: "Sắp xếp theo giá (mặc định giá thấp → cao)" }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page-size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        "200":
          description: Lưới unit thỏa filter (đã tính availability + buffer)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnitPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /units/{unitId}:
    get:
      tags: [Units]
      summary: Chi tiết unit — spec đầy đủ (FR-6, phần tĩnh)
      operationId: getUnit
      parameters:
        - { name: unitId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: Spec unit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnitDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/UnitNotFound" }

  /units/{unitId}/quote:
    get:
      tags: [Units]
      summary: Bảng giá minh bạch (FR-6) + nền cho Booking Summary (FR-7, AD-11)
      description: |
        PricingEngine tính từ Policy active tại thời điểm gọi — nguồn DUY NHẤT
        của mọi dòng tiền (Unit Detail, Booking Summary, Payment Modal khớp
        tuyệt đối). Khi reserve, quote này được snapshot vào reservation.
      operationId: getUnitQuote
      parameters:
        - { name: unitId, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: start-date, in: query, required: true, schema: { type: string, format: date } }
        - { name: end-date, in: query, required: true, schema: { type: string, format: date } }
      responses:
        "200":
          description: Bảng giá từng dòng + tổng + cọc
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quote" }
              example:
                unitId: 3
                startDate: "2026-10-03"
                endDate: "2027-01-02"
                endDate: "2026-11-02"
                lines:
                  - { kind: RENT, code: RENT_RATE, label: "Rent 345.000 ₫ × 3 months", amount: 1035000, refundable: false }
                  - { kind: DEPOSIT, code: DEPOSIT_RATE, label: "Deposit (10%, refundable)", amount: 103500, refundable: true }
                totalRent: 1035000
                depositAmount: 103500
                dueNow: 103500
                policyVersion: v3
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/UnitNotFound" }

  # ------------------------- RESERVATIONS (US-9/10/12) --------------------

  /booking-drafts:
    post:
      tags: [Reservations]
      summary: Giữ chỗ tạm 30 phút — CHƯA tạo đơn thuê
      description: |
        Kiểm tra availability (reservation + draft khác) rồi tạo booking draft.
        Draft không xuất hiện trong danh sách đơn thuê; reservation chỉ sinh
        sau khi PayOS SUCCEEDED (purpose DEPOSIT với draftId).
      operationId: createBookingDraft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [unitId, startDate, endDate]
              properties:
                unitId: { type: integer, format: int64 }
                startDate: { type: string, format: date }
                endDate: { type: string, format: date, description: "Ngày trả kho (inclusive), >= startDate" }
            example: { unitId: 3, startDate: "2026-10-03", endDate: "2026-11-02" }
      responses:
        "201":
          description: Booking draft + quote snapshot + hạn giữ chỗ 30 phút
          content:
            application/json:
              schema:
                type: object
                required: [id, startDate, endDate, depositAmount, expiresAt]
                properties:
                  id: { type: integer, format: int64 }
                  startDate: { type: string, format: date }
                  endDate: { type: string, format: date }
                  depositAmount: { type: integer }
                  durationDays: { type: integer }
                  quote: { $ref: "#/components/schemas/Quote" }
                  expiresAt: { type: string, format: date-time }
                  unit:
                    type: object
                    properties:
                      code: { type: string }
                      sizeM2: { type: number }
                      typeName: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Unit vừa bị chiếm / ngày không còn hợp lệ
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: BOOKING_UNIT_TAKEN, message: "S-3 vừa được đặt. 5 unit tương tự còn trống.", fieldErrors: [] }

  /reservations:
    get:
      tags: [Reservations]
      summary: "Danh sách của tôi — My Rentals (FR-35): FE nhóm theo status"
      description: |
        FE gộp nhóm hiển thị: Reservations = PENDING_PAYMENT | RESERVED;
        Rentals = CHECKED_IN | CHECKOUT_REQUESTED; History = CLOSED | EXPIRED.
        Mọi số liệu nguyên văn từ server — FE không tự tính lại.
        EXPIRED no-show cũng suy diễn on-read ở list này (AD-4, cùng quy tắc
        GET /reservations/{id}) — item quá hạn hiển thị đúng nhóm History ngay
        khi load, không phải chờ mở detail.
      operationId: listMyReservations
      parameters:
        - { name: group, in: query, schema: { type: string, enum: [active, history], default: active }, description: "active = PENDING_PAYMENT/RESERVED/CHECKED_IN/CHECKOUT_REQUESTED; history = CLOSED/EXPIRED" }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page-size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        "200":
          description: Danh sách reservation của customer đang đăng nhập
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReservationPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /reservations/{reservationId}:
    get:
      tags: [Reservations]
      summary: Rental Detail (FR-35) + kích hoạt EXPIRED no-show on-read (FR-36, AD-4)
      description: |
        Nếu đã qua ngày nhận kho mà chưa check-in, lần đọc đầu tiên này
        chuyển Reservation → EXPIRED (exactly-once, idempotent): mất cọc,
        Unit → Available, Contract Draft → Closed, ActivityLog + notification
        cho khách. Response trả state đã suy diễn xong.
      operationId: getReservation
      parameters:
        - { name: reservationId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: Chi tiết đầy đủ (unit, dates, deposit, payments, contract chain, accessCode nếu đã cấp)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReservationDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/ReservationNotFound" }

  /reservations/{reservationId}/check-in-pass:
    get:
      tags: [Reservations]
      summary: Check-in Pass (FR-35) — mã BK- hiển thị lớn để staff validate tại quầy
      operationId: getCheckInPass
      parameters:
        - { name: reservationId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: Thông tin check-in pass
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: BK-1042 }
                  unit: { $ref: "#/components/schemas/UnitSummary" }
                  startDate: { type: string, format: date }
                  checkInDeadline: { type: string, format: date, description: "Hạn cuối nhận kho — quá hạn mất cọc (FR-36)" }
                  instructions:
                    type: array
                    items: { type: string }
                    example: ["Mang CMND/CCCD để ký hợp đồng", "Chuẩn bị thanh toán 100% tiền thuê tại quầy"]
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/ReservationNotFound" }
        "409":
          description: Reservation không ở trạng thái RESERVED (chưa cọc / đã check-in / hết hạn)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: RESERVATION_INVALID_STATE, message: "Check-in pass chỉ khả dụng khi đặt chỗ đã xác nhận.", fieldErrors: [] }

  /reservations/{reservationId}/check-in:
    post:
      tags: [Reservations]
      summary: "US-15 (FR-11/14/15): staff hoàn tất check-in tại quầy"
      description: |
        Ritual: hợp đồng hiện hành DRAFT/PRINTED → SIGNED kèm ảnh bản ký
        (FR-11 — action CONTRACT_SIGNED ghi ActivityLog), sinh Access Code,
        Reservation → CHECKED_IN, Unit → RENTED, task CHECK_IN → DONE,
        notification CHECK_IN_COMPLETED. Tiền đề đã validate với lý do cụ thể:
        deposit đã trả, rent 100% đã thu qua Payment Modal (purpose RENT),
        chưa quá hạn nhận kho. Attachments upload thuộc Sprint 2 khác —
        signedPhotoUrl giữ shape URL như seed.
      operationId: checkInReservation
      parameters:
        - { name: reservationId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signedPhotoUrl]
              properties:
                signedPhotoUrl: { type: string, example: "/storage/contracts/CT-1046-signed.jpg" }
      responses:
        "200":
          description: Check-in hoàn tất — accessCode trao khách tại quầy
          content:
            application/json:
              schema:
                type: object
                properties:
                  reservationId: { type: integer, format: int64, example: 20 }
                  code: { type: string, example: BK-1046 }
                  status: { type: string, example: CHECKED_IN }
                  accessCode: { type: string, example: "482913" }
                  unitCode: { type: string, example: LOCK-1 }
                  unitStatus: { type: string, example: RENTED }
                  contractCode: { type: string, example: CT-1046 }
                  contractStatus: { type: string, example: SIGNED }
                  signedPhotoUrl: { type: string, example: "/storage/contracts/CT-1046-signed.jpg" }
                  taskStatus: { type: string, nullable: true, example: DONE }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/ReservationNotFound" }
        "409":
          description: "FR-14 — lý do cụ thể: chưa trả cọc / chưa thu 100% rent / đã check-in / quá hạn no-show / hợp đồng không ký được"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: RESERVATION_INVALID_STATE, message: "Chưa thu tiền thuê — trả 100% rent qua Payment Modal trước khi check-in.", fieldErrors: [] }

  # --------------------------- EXTENSIONS (US-18, FR-16/12) -----------------

  /reservations/{reservationId}/extensions:
    post:
      tags: [Reservations]
      summary: "US-18 (FR-16): tạo yêu cầu gia hạn — bước 1/2, trả bảng tính server-truth"
      description: |
        Customer-only. BE validate + tính toàn bộ chi phí theo AD-11 (FE không
        gửi amount): addedRent = tiền thuê kỳ thêm theo policy active;
        depositTopUp = max(0, Deposit% × tổng tiền thuê sau gia hạn − cọc đang giữ).
        Boundary xung đột: latestNewCheckout = ngày bắt đầu của reservation kế
        tiếp trên cùng unit − 1 (FR-16 — không buffer). Gia hạn chỉ mở trước
        EndDate; qua EndDate giữ CHECKED_IN và tính LATE_FEE lúc tất toán.
        Response kèm extensionId PENDING_PAYMENT → FE mở Payment Modal sẵn có
        với purpose EXTENSION_FEE (bước 2/2). Thanh toán thành công mới dịch
        EndDate + nâng cọc + sinh addendum CT-...-A{n} hẹn ký quầy 7 ngày (FR-12).
      operationId: requestExtension
      parameters:
        - { name: reservationId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newEndDate]
              properties:
                newEndDate: { type: string, format: date, example: "2026-12-19" }
      responses:
        "200":
          description: Extension PENDING_PAYMENT đã sẵn sàng — mở Payment Modal purpose EXTENSION_FEE
          content:
            application/json:
              schema:
                type: object
                properties:
                  extensionId: { type: integer, format: int64, example: 2 }
                  oldEndDate: { type: string, format: date, example: "2026-10-18" }
                  newEndDate: { type: string, format: date, example: "2026-12-18" }
                  addedMonths: { type: integer, example: 2 }
                  addedRent: { type: integer, example: 690000 }
                  depositHeldCurrent: { type: integer, example: 103500 }
                  depositTopUp: { type: integer, example: 69000 }
                  newDepositHeld: { type: integer, example: 172500 }
                  totalPayable: { type: integer, example: 759000 }
                  latestNewCheckout:
                    type: string
                    format: date
                    nullable: true
                    example: "2026-10-18"
                  policyVersion: { type: string, example: "v3" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/ReservationNotFound" }
        "409":
          description: "Lý do cụ thể: không phải CHECKED_IN / đã qua EndDate (LATE_FEE) / newEndDate ≤ EndDate hiện tại / xung đột lịch với đơn kế tiếp"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: RESERVATION_INVALID_STATE, message: "Xung đột lịch — kho S-3 đã có khách đặt trước bắt đầu 2026-10-19. Latest new checkout: 2026-10-18.", fieldErrors: [] }

  # --------------------------- CHECKOUT REQUEST (US-20, FR-17) --------------

  /reservations/{reservationId}/checkout-request:
    post:
      tags: [Reservations]
      summary: "US-20 (FR-17): Khách gửi yêu cầu trả kho (Checkout Request)"
      description: |
        Khách gửi yêu cầu trả kho từ Rental Detail kèm giải thích logic tất toán cọc.
        Reservation -> CHECKOUT_REQUESTED, Checkout Task sinh ra cho ca trực.
        Request mới thay thế request cũ (request cũ tự hủy).
        Ngày xin trả bị chặn trên biên Reservation kế tiếp (như Extension).
      operationId: createCheckoutRequest
      parameters:
        - { name: reservationId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCheckoutRequest" }
      responses:
        "200":
          description: Yêu cầu trả kho đã được tiếp nhận
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutRequestResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/ReservationNotFound" }
        "409":
          description: Đơn không ở trạng thái CHECKED_IN hoặc ngày trả bị xung đột với reservation kế tiếp
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [Reservations]
      summary: "US-20 (FR-17): Khách hủy yêu cầu trả kho"
      description: |
        Hủy yêu cầu trả kho đang chờ (PENDING) -> Reservation trở lại CHECKED_IN,
        Checkout Task tương ứng bị hủy khỏi Task board.
      operationId: cancelCheckoutRequest
      parameters:
        - { name: reservationId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: Hủy yêu cầu trả kho thành công
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CancelCheckoutResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/ReservationNotFound" }
        "409":
          description: Đơn không ở trạng thái CHECKOUT_REQUESTED
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      tags: [Reservations]
      summary: "US-20 (FR-17): Xem yêu cầu trả kho hiện tại (PENDING) của đơn thuê"
      operationId: getLatestCheckoutRequest
      parameters:
        - { name: reservationId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: Chi tiết yêu cầu trả kho đang chờ xử lý
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutRequestResponse" }
        "204": { description: "Không có yêu cầu trả kho nào đang chờ" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/ReservationNotFound" }

  # --------------------------- TASKS (US-15, FR-25) ------------------------

  /tasks:
    get:
      tags: [Tasks]
      summary: "US-15 (FR-25): Task Board của ca trực — staff only"
      description: |
        Task theo ngày (mặc định hôm nay giờ ICT). Task CHECK_IN kèm ritual
        flags derive-on-read (AD-4): depositVerified, rentCollected,
        rentAmountDue, depositPaid, contractSigned, contractPhotoUrl,
        accessCodeHanded — FE bật/tắt nút ritual theo flags, không tự tính.
      operationId: listTasks
      parameters:
        - { name: date, in: query, schema: { type: string, format: date }, description: "Mặc định: hôm nay (ICT)" }
      responses:
        "200":
          description: Danh sách task trong ngày
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    taskId: { type: integer, format: int64 }
                    type: { type: string, enum: [CHECK_IN, CHECKOUT, CLEANING, SUPPORT, CONTRACT] }
                    refCode: { type: string, nullable: true, example: BK-1046 }
                    unitCode: { type: string, nullable: true, example: LOCK-1 }
                    customerName: { type: string, nullable: true, example: "Nguyễn Thị Lan" }
                    customerPhone: { type: string, nullable: true, example: "0901 234 567" }
                    workDate: { type: string, format: date }
                    status: { type: string, enum: [TODO, IN_PROGRESS, DONE] }
                    ritual:
                      type: object
                      nullable: true
                      description: "Chỉ có với type CHECK_IN"
                      properties:
                        depositVerified: { type: boolean }
                        rentCollected: { type: boolean }
                        rentAmountDue: { type: integer, nullable: true, example: 300000 }
                        depositPaid: { type: integer, nullable: true, example: 30000 }
                        contractSigned: { type: boolean }
                        contractPhotoUrl: { type: string, nullable: true }
                        accessCodeHanded: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # --------------------------- PAYMENTS (US-8, AD-9) ----------------------

  /payments:
    post:
      tags: [Payments]
      summary: Bắt đầu thanh toán (Payment Modal) — FR-8
      description: |
        DEPOSIT nhận `draftId` (booking draft giữ chỗ 30 phút) — reservation
        chỉ được sinh sau khi PayOS SUCCEEDED. RENT (check-in tại quầy — US-15)
        nhận `reservationId` và chỉ mở khi reservation đã RESERVED, chưa quá
        hạn nhận kho. Truyền đúng một trong hai id.
        Kết quả thanh toán do gateway phía server quyết định — KHÔNG có field
        outcome trong request.
        CARD / MOMO / VNPAY = DEMO: trả PROCESSING, FE poll GET ~1s sau đó
        SUCCEEDED; không cần thẻ/OTP/QR hợp lệ (demo bỏ bước OTP).
        PAYOS = THẬT (backend bật PAYOS_ENABLED=true + 3 key): trả PENDING +
        `checkoutUrl` + `qrCode` (VietQR động) + `qrExpiresAt`; khách quét
        VietQR hoặc mở cổng PayOS, FE poll GET cho tới khi webhook xác nhận.
        Chưa cấu hình PayOS → 400 VALIDATION_FAILED với hướng dẫn bật.
      operationId: createPayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose, method]
              properties:
                purpose: { $ref: "#/components/schemas/PaymentPurpose" }
                reservationId: { type: integer, format: int64, nullable: true, description: "RENT/EXTENSION_FEE" }
                draftId: { type: integer, format: int64, nullable: true, description: "DEPOSIT — booking draft" }
                method: { $ref: "#/components/schemas/PaymentMethod" }
                card:
                  type: object
                  required: [number, expiry, cvc]
                  properties:
                    number: { type: string, example: "4242424242424242" }
                    expiry: { type: string, example: "12/28" }
                    cvc: { type: string, example: "123" }
                momoPhone: { type: string, example: "0901234567" }
              description: "card bắt buộc khi method=CARD; momoPhone bắt buộc khi method=MOMO; VNPAY không cần field bổ sung."
            example: { purpose: DEPOSIT, draftId: 12, method: PAYOS }
      responses:
        "201":
          description: Payment session khởi tạo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Trạng thái không cho thanh toán (đã trả / sai phase) hoặc duplicate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                duplicate:
                  value: { code: PAYMENT_DUPLICATE, message: "Khoản này đã được thanh toán.", fieldErrors: [] }
                invalidState:
                  value: { code: PAYMENT_INVALID_STATE, message: "Đặt chỗ này không ở trạng thái chờ thanh toán.", fieldErrors: [] }
    get:
      tags: [Payments]
      summary: Lịch sử payment/receipt (Rental Detail — payment history, FR-9)
      operationId: listPayments
      parameters:
        - { name: reservation-id, in: query, schema: { type: integer, format: int64 }, description: "Lọc theo reservation (mặc định: mọi payment của tôi)" }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page-size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        "200":
          description: Danh sách payment (receipt xem được vĩnh viễn)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /payments/{paymentId}:
    get:
      tags: [Payments]
      summary: Trạng thái payment (FE poll trong lúc Processing — AD-9)
      description: FE hiển thị đồng hồ đếm từ giá trị server (qrExpiresAt); spinner local được phép nhưng không tự quyết kết quả.
      operationId: getPayment
      parameters:
        - { name: paymentId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: Trạng thái hiện tại của payment (đủ qrExpiresAt/otpExpiresAt cho countdown + receipt khi terminal)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Không tìm thấy payment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: PAYMENT_NOT_FOUND, message: "Không tìm thấy giao dịch này.", fieldErrors: [] }

  /payments/{paymentId}/confirm:
    post:
      tags: [Payments]
      summary: Xác nhận bước thứ hai (MoMo OTP) — terminal result
      description: |
        Chỉ dùng cho MoMo (OTP giả lập). CARD/VNPAY terminal qua poll, không
        gọi endpoint này. Thành công: response trả kèm receipt + reservation
        cập nhật + contract draft (nếu purpose=DEPOSIT, FR-10) + notification
        (FE bắn toast từ response — Conventions). Thất bại: FAIL tile "No money
        was taken" — không đổi trạng thái gì anywhere; FE Retry/Switch bằng
        cách tạo payment mới.
      operationId: confirmPayment
      parameters:
        - { name: paymentId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [otp]
              properties:
                otp: { type: string, minLength: 6, maxLength: 6, example: "123456" }
      responses:
        "200":
          description: Kết quả terminal SUCCEEDED hoặc FAILED (mock gateway quyết định)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Payment không ở trạng thái chờ confirm
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                expired:
                  value: { code: PAYMENT_EXPIRED, message: "Phiên thanh toán đã hết hạn (QR/OTP). Chọn lại phương thức để tiếp tục.", fieldErrors: [] }
                invalidState:
                  value: { code: PAYMENT_INVALID_STATE, message: "Giao dịch này đã kết thúc.", fieldErrors: [] }

  /payments/webhooks/payos:
    post:
      tags: [Payments]
      summary: Webhook PayOS — public, xác thực HMAC-SHA256
      description: |
        PayOS gọi endpoint này sau khi khách chuyển khoản. Không dùng JWT;
        chữ ký HMAC-SHA256 trong `signature` được verify bằng
        PAYOS_CHECKSUM_KEY (SDK PayOS). Gateway chỉ verify + trả event đã
        chuẩn hóa; `PaymentService` là single writer (AD-4/AD-9) — chuyển
        payment PENDING/PROCESSING → SUCCEEDED (kích hoạt handler theo purpose
        DEPOSIT/RENT/EXTENSION_FEE) hoặc FAILED. Idempotent theo orderCode:
        payment đã terminal thì trả 200 và không chạy lại handler.
      operationId: payOsWebhook
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PayOsWebhook" }
      responses:
        "200":
          description: Webhook đã xử lý (hoặc đã xử lý trước đó — idempotent)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: "00" }
                  desc: { type: string, example: "success" }
        "400":
          description: JSON hỏng, thiếu chữ ký hoặc chữ ký không hợp lệ
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: PAYMENT_WEBHOOK_INVALID, message: "Chữ ký webhook PayOS không hợp lệ.", fieldErrors: [] }

  # ------------------- CONTRACTS (US-11/13, FR-10/13) ---------------------

  /reservations/{reservationId}/contracts:
    get:
      tags: [Contracts]
      summary: Chuỗi hợp đồng trên Rental Detail (FR-13) — gốc + phụ lục
      description: |
        Sprint 1: chỉ contract gốc (auto-draft khi Deposit thành công, read-only
        mọi nơi). Schema đã sẵn kind ADDENDUM cho sprint sau. Bản Superseded
        vẫn đọc được trong chuỗi.
      operationId: listContractsByReservation
      parameters:
        - { name: reservationId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: Chuỗi contract theo thứ tự sinh
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ContractChainItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/ReservationNotFound" }

  /contracts/{contractId}:
    get:
      tags: [Contracts]
      summary: Chi tiết 1 contract — contentSnapshot để FE render print view (FR-11)
      description: Contract read-only — không có endpoint sửa; sai sót sửa bằng re-draft (sprint sau).
      operationId: getContract
      parameters:
        - { name: contractId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: Chi tiết contract
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContractDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Không tìm thấy contract
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: CONTRACT_NOT_FOUND, message: "Không tìm thấy hợp đồng này.", fieldErrors: [] }

  /contracts/{contractId}/chain:
    get:
      tags: [Contracts]
      summary: Lấy chuỗi hợp đồng gốc + các phụ lục gia hạn (FR-13, US-19)
      description: Trả về thông tin hợp đồng gốc kèm toàn bộ các phụ lục theo thứ tự thời gian.
      operationId: getContractChain
      parameters:
        - { name: contractId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: Chuỗi hợp đồng và phụ lục
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContractChainResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Không tìm thấy hợp đồng
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /contract-addendums/{addendumId}/sign:
    post:
      tags: [Contracts]
      summary: Ký phụ lục hợp đồng tại quầy (FR-12, US-19)
      description: |
        Staff tại quầy chụp ảnh bản ký giấy của phụ lục và upload lên.
        Bắt buộc có signedPhotoUrl (Snap-back rule).
        Deadline ký 7 ngày kể từ khi sinh phụ lục; quá hạn chuyển EXPIRED (409).
        Ký thành công: status -> SIGNED, ghi Activity Log ADDENDUM_SIGNED.
      operationId: signContractAddendum
      parameters:
        - { name: addendumId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContractAddendumSignRequest" }
      responses:
        "200":
          description: Ký phụ lục thành công
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContractAddendumResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Không tìm thấy phụ lục
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Xung đột trạng thái (đã ký hoặc quá hạn ký 7 ngày)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ------------------------ NOTIFICATIONS (FR-33/34) ----------------------

  /notifications:
    get:
      tags: [Notifications]
      summary: Bell feed — unread trước (FR-34)
      operationId: listNotifications
      parameters:
        - { name: unread-only, in: query, schema: { type: boolean, default: false } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page-size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        "200":
          description: Feed notification của user (deep link theo registry trong contracts/routes.yaml)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /notifications/unread-count:
    get:
      tags: [Notifications]
      summary: Đếm unread cho bell badge — endpoint nhẹ, poll riêng (FR-33)
      operationId: getUnreadCount
      responses:
        "200":
          description: Số chưa đọc
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer, example: 3 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /notifications/mark-all-read:
    post:
      tags: [Notifications]
      summary: Đánh dấu đã đọc tất cả (FR-34)
      operationId: markAllRead
      responses:
        "204": { description: "Đã đánh dấu tất cả là đã đọc" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ---------------------------- TASKS (FR-21/22, NFR-2) -----------------------

  /tasks:
    get:
      tags: [Tasks]
      summary: Lấy danh sách task board cho staff trực ca (FR-21 / NFR-2)
      description: |
        Mặc định: hiện thẻ trong ngày/ca hiện tại của staff đăng nhập.
        Board đúng 3 cột: To do / In progress / Done.
        Thẻ đúng 5 loại: Check-in / Checkout / Cleaning / Support / Contract-signature.
        Hỗ trợ lọc theo workDate, shift, type, status.
      operationId: getTasks
      parameters:
        - { name: workDate, in: query, schema: { type: string, format: date }, description: "Ngày làm việc (mặc định hôm nay ICT)" }
        - { name: shift, in: query, schema: { type: string, enum: [MORNING, AFTERNOON, EVENING] }, description: "Ca trực (mặc định ca hiện tại ICT)" }
        - { name: type, in: query, schema: { $ref: "#/components/schemas/TaskType" }, description: "Lọc theo 1 trong 5 loại thẻ" }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/TaskStatus" }, description: "Lọc theo trạng thái kanban" }
      responses:
        "200":
          description: Danh sách thẻ kanban cho ca trực
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TaskCard" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

    post:
      tags: [Tasks]
      summary: Hệ thống sinh task tự động gán cho staff trực ca phụ trách Zone (FR-21)
      description: |
        Task được tự động phân cho staff đang trực ca và phụ trách Zone chứa Unit
        tại thời điểm task phát sinh. Không hỗ trợ giao task thủ công.
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTaskRequest" }
      responses:
        "201":
          description: Thẻ task được tạo và tự động phân công thành công
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskCard" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /tasks/{taskId}:
    get:
      tags: [Tasks]
      summary: Chi tiết 1 nhiệm vụ task board
      operationId: getTaskDetail
      parameters:
        - { name: taskId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: Chi tiết nhiệm vụ
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskCard" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/TaskNotFound" }

  /tasks/{taskId}/status:
    patch:
      tags: [Tasks]
      summary: Cập nhật trạng thái nhiệm vụ (To do -> In progress -> Done, snap-back FR-22)
      description: |
        Kéo thả hoặc bấm nút Move để chuyển trạng thái thẻ.
        Snap-back (FR-22): Chặn kéo sang Done khi còn thiếu bước chốt nghiệp vụ
        (payment/settlement/ảnh bản ký) -> trả 409 TASK_SNAP_BACK kèm lý do cụ thể.
      operationId: updateTaskStatus
      parameters:
        - { name: taskId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateTaskStatusRequest" }
      responses:
        "200":
          description: Đã cập nhật trạng thái nhiệm vụ
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskCard" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/TaskNotFound" }
        "409": { $ref: "#/components/responses/TaskSnapBack" }

# --------------------- SHIFTS & STAFFING (FR-27) -----------------------

  /shifts:
    get:
      tags: [Shifts]
      summary: Lấy danh sách phân ca trực theo khoảng ngày (FR-27)
      description: |
        Hỗ trợ lọc theo startDate, endDate, staffId, zoneId.
        Phục vụ hiển thị lưới lịch tuần (Schedule · this week) của Facility Manager.
      operationId: getShifts
      parameters:
        - { name: startDate, in: query, schema: { type: string, format: date }, description: "Ngày bắt đầu (mặc định đầu tuần hiện tại ICT)" }
        - { name: endDate, in: query, schema: { type: string, format: date }, description: "Ngày kết thúc (mặc định cuối tuần hiện tại ICT)" }
        - { name: staffId, in: query, schema: { type: integer, format: int64 }, description: "Lọc theo nhân viên" }
        - { name: zoneId, in: query, schema: { type: integer }, description: "Lọc theo khu vực (Zone)" }
      responses:
        "200":
          description: Danh sách phân công ca trực
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ShiftAssignmentResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

    post:
      tags: [Shifts]
      summary: Phân công ca trực mới kèm phát hiện xung đột (FR-27)
      description: |
        Facility Manager phân công staff × Zone × ca × ngày.
        Hệ thống kiểm tra xung đột trước khi lưu (Pre-save validation & rejection).
        Nếu trùng người - ca - ngày, từ chối với 409 Conflict và thông báo cụ thể.
      operationId: createShiftAssignment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateShiftAssignmentRequest" }
      responses:
        "201":
          description: Phân công ca trực thành công
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShiftAssignmentResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/ShiftConflict" }

  /shifts/{assignmentId}:
    delete:
      tags: [Shifts]
      summary: Hủy phân công ca trực (FR-27)
      description: Gỡ bỏ ca trực và ghi nhận Activity Log.
      operationId: deleteShiftAssignment
      parameters:
        - { name: assignmentId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "204":
          description: Đã hủy phân công ca trực
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/ShiftNotFound" }

  /shifts/roster:
    get:
      tags: [Shifts]
      summary: Lấy danh sách nhân sự trực ca kèm thống kê tuần (FR-27 / F5-03)
      description: Danh sách nhân viên (Staff Roster) kèm số lượng ca đã gán và trạng thái xung đột.
      operationId: getStaffRoster
      parameters:
        - { name: startDate, in: query, schema: { type: string, format: date }, description: "Ngày bắt đầu tuần" }
        - { name: endDate, in: query, schema: { type: string, format: date }, description: "Ngày kết thúc tuần" }
      responses:
        "200":
          description: Danh sách nhân sự và số ca trực
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StaffRosterMember" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

# --------------------- USERS / SYS-01 (US-28, FR-37) --------------------

  /activity-logs:
    get:
      tags: [ActivityLogs]
      summary: Xem nhật ký hoạt động hệ thống (FR-28 / NFR-6)
      description: |
        Audit trail append-only: timestamp, actor, entity, action, from → to, reason.
        Hỗ trợ lọc theo entityType, query text, date range, phân trang (mặc định 25 rows).
        Dành cho Facility Manager và System Administrator. Read-only hoàn toàn (cấm sửa/xóa).
      operationId: getActivityLogs
      parameters:
        - { name: query, in: query, schema: { type: string }, description: "Tìm kiếm theo tên actor, action, reason" }
        - { name: entityType, in: query, schema: { type: string }, description: "Lọc theo entity type (UNIT, RESERVATION, CONTRACT, STAFF_ASSIGNMENT, USER, TICKET, PAYMENT...)" }
        - { name: startDate, in: query, schema: { type: string, format: date }, description: "Từ ngày (YYYY-MM-DD)" }
        - { name: endDate, in: query, schema: { type: string, format: date }, description: "Đến ngày (YYYY-MM-DD)" }
        - { name: page, in: query, schema: { type: integer, default: 1, minimum: 1 }, description: "Trang (1-based)" }
        - { name: pageSize, in: query, schema: { type: integer, default: 25, minimum: 1, maximum: 100 }, description: "Số bản ghi mỗi trang (mặc định 25)" }
      responses:
        "200":
          description: Danh sách nhật ký hoạt động phân trang
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityLogPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /users:
    get:
      tags: [Users]
      summary: Danh sách người dùng — SYS-01 (FR-37)
      description: |
        Chỉ dành cho SYSTEM_ADMIN.
        Tìm kiếm theo tên, email, phone; lọc theo role và status (0=DEACTIVATED, 1=ACTIVE, 2=LOCKED); phân trang.
      operationId: listUsers
      parameters:
        - { name: query, in: query, schema: { type: string }, description: "Tìm kiếm tự do theo họ tên, email hoặc số điện thoại" }
        - { name: role, in: query, schema: { $ref: "#/components/schemas/RoleName" }, description: "Lọc theo vai trò" }
        - { name: status, in: query, schema: { type: integer, enum: [0, 1, 2] }, description: "0: DEACTIVATED, 1: ACTIVE, 2: LOCKED" }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page-size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: Trang danh sách người dùng
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

    post:
      tags: [Users]
      summary: Tạo tài khoản người dùng mới kèm mật khẩu tạm (FR-37)
      description: |
        Chỉ dành cho SYSTEM_ADMIN.
        Tạo tài khoản cho mọi Role. Mật khẩu tạm được sinh ngẫu nhiên và trả về trong response để Admin bàn giao.
        Email trùng trả về 409 Conflict (AUTH_EMAIL_EXISTS).
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "201":
          description: Tạo tài khoản thành công kèm mật khẩu tạm
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateUserResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Email đã tồn tại trong hệ thống
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /users/login-history:
    get:
      tags: [Users]
      summary: Lịch sử đăng nhập hệ thống — SYS-02 (FR-38)
      description: |
        Chỉ dành cho SYSTEM_ADMIN.
        Xem lịch sử đăng nhập (thành công/thất bại) kèm actor, thời điểm, kết quả và lý do.
        Hỗ trợ lọc theo userId, trạng thái (ALL, SUCCESS, FAILED), từ khóa query, khoảng ngày và phân trang.
      operationId: getLoginHistory
      parameters:
        - { name: userId, in: query, schema: { type: integer, format: int64 }, description: "Lọc theo ID người dùng cụ thể" }
        - { name: status, in: query, schema: { type: string, enum: [ALL, SUCCESS, FAILED] }, description: "Lọc theo kết quả đăng nhập" }
        - { name: query, in: query, schema: { type: string }, description: "Tìm kiếm theo họ tên, email hoặc lý do" }
        - { name: startDate, in: query, schema: { type: string, format: date }, description: "Từ ngày (YYYY-MM-DD)" }
        - { name: endDate, in: query, schema: { type: string, format: date }, description: "Đến ngày (YYYY-MM-DD)" }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        "200":
          description: Trang danh sách lịch sử đăng nhập
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginHistoryPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /users/permissions:
    get:
      tags: [Users]
      summary: Ma trận phân quyền 5 vai trò cố định — (FR-39)
      description: |
        Chỉ dành cho SYSTEM_ADMIN.
        Xem bảng Role × Permission đúng như server enforce (NFR-4). Read-only hoàn toàn, cố định trong code.
      operationId: getPermissionMatrix
      responses:
        "200":
          description: Bảng ma trận phân quyền hệ thống
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PermissionMatrixResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /users/{userId}:
    get:
      tags: [Users]
      summary: Chi tiết người dùng theo ID (FR-37)
      operationId: getUserDetail
      parameters:
        - { name: userId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: Chi tiết người dùng
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/UserNotFound" }

  /users/{userId}/status:
    patch:
      tags: [Users]
      summary: Cập nhật trạng thái người dùng (Activate / Deactivate / Lock) (FR-37)
      description: |
        Chỉ dành cho SYSTEM_ADMIN.
        Anti-lockout: Admin không được tự deactivate hoặc lock tài khoản của chính mình.
        Ghi nhận sự thay đổi vào ActivityLog (EntityType USER).
      operationId: updateUserStatus
      parameters:
        - { name: userId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserStatusRequest" }
      responses:
        "200":
          description: Cập nhật trạng thái thành công
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/UserNotFound" }

  /users/{userId}/role:
    patch:
      tags: [Users]
      summary: Đổi vai trò người dùng (FR-37)
      description: |
        Chỉ dành cho SYSTEM_ADMIN.
        Anti-lockout: Admin không được tự hạ vai trò của chính mình.
        Ghi nhận sự kiện ROLE_CHANGED vào ActivityLog.
      operationId: updateUserRole
      parameters:
        - { name: userId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserRoleRequest" }
      responses:
        "200":
          description: Đổi vai trò thành công
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/UserNotFound" }

  /users/{userId}/reset-password:
    post:
      tags: [Users]
      summary: Cấp lại mật khẩu tạm mới (FR-37)
      description: |
        Chỉ dành cho SYSTEM_ADMIN.
        Sinh mật khẩu tạm mới ngẫu nhiên, lưu hash BCrypt và trả về plain text một lần duy nhất cho Admin.
        Ghi nhận PASSWORD_RESET vào ActivityLog.
      operationId: resetUserPassword
      parameters:
        - { name: userId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: Đã cấp lại mật khẩu tạm thành công
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResetPasswordResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/UserNotFound" }

# ---------------------------------------------------------------------------
  /reports/financial-summary:
    get:
      tags: [Reports]
      summary: Báo cáo tổng hợp tài chính và 4 chỉ số KPI cốt lõi (FR-31)
      description: |
        Chỉ dành cho BUSINESS_OPS và SYSTEM_ADMIN.
        Cung cấp 4 chỉ số: Doanh thu thực nhận, Tiền cọc an ninh trong Escrow (KHÔNG tính vào doanh thu),
        Tổng phụ thu phát sinh, Tỷ lệ lấp đầy cơ sở (Occupancy Rate).
        Hỗ trợ lọc theo kỳ mặc định (THIS_MONTH, LAST_MONTH, THIS_QUARTER, YTD) hoặc khoảng ngày tự chọn (CUSTOM).
      operationId: getFinancialSummary
      parameters:
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: [THIS_MONTH, LAST_MONTH, THIS_QUARTER, YTD, CUSTOM]
            default: THIS_QUARTER
          description: Kỳ báo cáo
        - name: startDate
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Ngày bắt đầu (khi period = CUSTOM)
        - name: endDate
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Ngày kết thúc (khi period = CUSTOM)
      responses:
        "200":
          description: Báo cáo tổng hợp tài chính theo kỳ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialSummary"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /reports/monthly-revenue:
    get:
      tags: [Reports]
      summary: Dữ liệu chuỗi thời gian doanh thu hàng tháng (FR-31)
      description: |
        Chỉ dành cho BUSINESS_OPS và SYSTEM_ADMIN.
        Phục vụ biểu đồ doanh thu theo tháng (tiền thuê, phụ thu, tiền cọc phong tỏa).
      operationId: getMonthlyRevenueChart
      parameters:
        - name: months
          in: query
          required: false
          schema:
            type: integer
            default: 6
            minimum: 1
            maximum: 24
          description: Số tháng thống kê gần nhất
      responses:
        "200":
          description: Danh sách dữ liệu doanh thu từng tháng
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MonthlyRevenueItem"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /reports/drilldown:
    get:
      tags: [Reports]
      summary: Tra cứu chi tiết chứng từ theo từng KPI (KPI Drill-down) (FR-31)
      description: |
        Chỉ dành cho BUSINESS_OPS và SYSTEM_ADMIN.
        Bấm vào bất kỳ KPI nào (REVENUE, DEPOSIT, SURCHARGE, OCCUPANCY) để xem toàn bộ danh sách chứng từ cấu thành.
      operationId: getReportDrilldown
      parameters:
        - name: key
          in: query
          required: true
          schema:
            type: string
            enum: [REVENUE, DEPOSIT, SURCHARGE, OCCUPANCY]
          description: Loại chỉ số KPI cần drill-down
        - name: query
          in: query
          required: false
          schema:
            type: string
          description: Tìm kiếm tự do trong bảng chi tiết
      responses:
        "200":
          description: Danh sách dữ liệu drill-down kèm cấu hình cột
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DrilldownResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /reports/export:
    get:
      tags: [Reports]
      summary: Xuất báo cáo tài chính kiểm toán ra file CSV (FR-31)
      description: |
        Chỉ dành cho BUSINESS_OPS và SYSTEM_ADMIN.
        Xuất file CSV chuẩn kiểm toán (UTF-8 BOM), phân cách bằng dấu phẩy.
      operationId: exportReportCSV
      parameters:
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: [THIS_MONTH, LAST_MONTH, THIS_QUARTER, YTD, CUSTOM]
            default: THIS_QUARTER
      responses:
        "200":
          description: File CSV báo cáo kiểm toán
          content:
            text/csv:
              schema:
                type: string
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

# ---------------------------------------------------------------------------
  /facility/overview:
    get:
      tags: [Facility]
      summary: Dữ liệu tổng quan cơ sở vật chất và giám sát vận hành (FR-32)
      description: |
        Dành cho FACILITY_MANAGER, SYSTEM_ADMIN, và BUSINESS_OPS.
        Cung cấp 4 chỉ số KPI: Tỷ lệ lấp đầy (Occupancy), Tỷ lệ hoạt động (Units in Service),
        Nhiệm vụ trong ngày (Tasks Today), Sự cố leo thang (Open Escalations).
        Kèm 2 biểu đồ: Phân bổ trạng thái kho và Cơ cấu doanh thu theo loại kho.
        Kèm 1 bảng dữ liệu: Hàng chờ dọn dẹp & bàn giao (Turnover Queue).
      operationId: getFacilityOverview
      responses:
        "200":
          description: Dữ liệu bảng điều khiển tổng quan cơ sở
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FacilityOverviewResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /facility/drilldown:
    get:
      tags: [Facility]
      summary: Danh sách chi tiết kho phục vụ KPI drill-down (FR-32)
      description: |
        Dành cho FACILITY_MANAGER, SYSTEM_ADMIN, và BUSINESS_OPS.
        Bấm vào bất kỳ KPI nào (ví dụ Occupancy -> RENTED, Maintenance -> MAINTENANCE) để xem danh sách chi tiết các kho tương ứng.
        Hỗ trợ lọc theo trạng thái (status), tìm kiếm theo từ khóa (query) và phân trang.
      operationId: getFacilityDrilldown
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [AVAILABLE, RESERVED, RENTED, PREPARING, MAINTENANCE, RETIRED, ALL]
          description: Lọc theo trạng thái kho
        - name: query
          in: query
          required: false
          schema:
            type: string
          description: Tìm kiếm theo mã kho, loại kho hoặc khu vực
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Số trang (1-based)
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 25
            minimum: 1
            maximum: 100
          description: Số dòng trên mỗi trang
      responses:
        "200":
          description: Danh sách kho phân trang theo bộ lọc drill-down
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FacilityDrilldownResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Lỗi validation — fieldErrors chỉ ra field vi phạm
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { code: VALIDATION_FAILED, message: "Dữ liệu chưa hợp lệ.", fieldErrors: [{ field: "durationDays", code: "MIN", message: "Tối thiểu 1 tháng" }] }
    Unauthorized:
      description: Thiếu/không hợp lệ token — envelope Error từ AuthenticationEntryPoint
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { code: AUTH_TOKEN_INVALID, message: "Cần đăng nhập để tiếp tục.", fieldErrors: [] }
    Forbidden:
      description: Token hợp lệ nhưng role không có quyền (403 đơn giản — FR-1)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { code: ROLE_FORBIDDEN, message: "Tài khoản của bạn không có quyền truy cập trang này.", fieldErrors: [] }
    UnitNotFound:
      description: Unit không tồn tại
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { code: UNIT_NOT_FOUND, message: "Unit này không tồn tại.", fieldErrors: [] }
    ReservationNotFound:
      description: Reservation không tồn tại hoặc không phải của bạn
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { code: RESERVATION_NOT_FOUND, message: "Không tìm thấy đặt chỗ này.", fieldErrors: [] }
    TaskNotFound:
      description: Task không tồn tại
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { code: TASK_NOT_FOUND, message: "Không tìm thấy nhiệm vụ này.", fieldErrors: [] }
    TaskSnapBack:
      description: Vi phạm snap-back chống Done ảo (FR-22)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { code: TASK_SNAP_BACK, message: "Chặn Done ảo: Đơn chưa xác nhận thanh toán tiền cọc!", fieldErrors: [] }
    UserNotFound:
      description: Người dùng không tồn tại
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { code: USER_NOT_FOUND, message: "Không tìm thấy người dùng này.", fieldErrors: [] }
    ShiftConflict:
      description: Xung đột phân công ca trực (FR-27 — người-ca-ngày đã tồn tại)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { code: SHIFT_ASSIGNMENT_CONFLICT, message: "Minh is already assigned Morning shift, Zone B on Oct 12. Choose another staff member or another shift.", fieldErrors: [{ field: "shift", code: "CONFLICT", message: "Trùng ca trực" }] }
    ShiftNotFound:
      description: Không tìm thấy phân công ca trực
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { code: SHIFT_NOT_FOUND, message: "Không tìm thấy phân công ca trực này.", fieldErrors: [] }


  schemas:

    # ------------------------------ Envelope (AD-8) -----------------------

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine code UPPER_SNAKE
          enum: [VALIDATION_FAILED, AUTH_INVALID_CREDENTIALS, AUTH_ACCOUNT_LOCKED, AUTH_EMAIL_EXISTS, AUTH_TOKEN_INVALID, ROLE_FORBIDDEN, UNIT_NOT_FOUND, RESERVATION_NOT_FOUND, RESERVATION_INVALID_STATE, BOOKING_UNIT_TAKEN, PAYMENT_NOT_FOUND, PAYMENT_DUPLICATE, PAYMENT_INVALID_STATE, PAYMENT_EXPIRED, CONTRACT_NOT_FOUND, TASK_NOT_FOUND, TASK_SNAP_BACK, TASK_INVALID_STATE, USER_NOT_FOUND, SHIFT_ASSIGNMENT_CONFLICT, SHIFT_NOT_FOUND, INTERNAL_ERROR]
        message: { type: string, description: "Message human-readable theo khuôn NFR-7 (chuyện gì + hệ quả + 1 bước kế)" }
        fieldErrors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              code: { type: string }
              message: { type: string }

    # ------------------------------ Auth ----------------------------------

    RoleName:
      type: string
      enum: [CUSTOMER, STAFF, FACILITY_MANAGER, BUSINESS_OPS, SYSTEM_ADMIN]

    UserSummary:
      type: object
      required: [id, fullName, email, role]
      properties:
        id: { type: integer, format: int64 }
        fullName: { type: string }
        email: { type: string }
        phone: { type: string, nullable: true }
        role: { $ref: "#/components/schemas/RoleName" }

    AuthSession:
      type: object
      required: [token, expiresAt, user, landingRoute]
      properties:
        token: { type: string, description: JWT — client giữ, logout = drop token }
        expiresAt: { type: string, format: date-time, description: "Hết hạn 24h (AD-5)" }
        user: { $ref: "#/components/schemas/UserSummary" }
        landingRoute:
          type: string
          description: Route FE đổ vào theo role (khớp contracts/routes.yaml)
          enum: [/browse, /tasks, /facility, /overview, /users]
          example: /browse

    UserDetail:
      type: object
      required: [id, fullName, email, role, status, createdAt]
      properties:
        id: { type: integer, format: int64 }
        fullName: { type: string, example: "Nguyễn Văn Admin" }
        email: { type: string, example: "admin@storagehub.vn" }
        phone: { type: string, nullable: true, example: "0901234567" }
        role: { $ref: "#/components/schemas/RoleName" }
        facilityId: { type: integer, format: int64, nullable: true }
        status: { type: integer, enum: [0, 1, 2], description: "0: DEACTIVATED, 1: ACTIVE, 2: LOCKED" }
        createdAt: { type: string, format: date-time }

    UserPage:
      type: object
      required: [items, page, pageSize, totalItems, totalPages]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/UserDetail" }
        page: { type: integer, example: 1 }
        pageSize: { type: integer, example: 20 }
        totalItems: { type: integer, example: 45 }
        totalPages: { type: integer, example: 3 }

    CreateUserRequest:
      type: object
      required: [fullName, email, role]
      properties:
        fullName: { type: string, example: "Trần Văn Staff" }
        email: { type: string, format: email, example: "staff2@demo.storagehub.vn" }
        phone: { type: string, nullable: true, example: "0912345678" }
        role: { $ref: "#/components/schemas/RoleName" }
        facilityId: { type: integer, format: int64, nullable: true }

    CreateUserResponse:
      type: object
      required: [user, temporaryPassword]
      properties:
        user: { $ref: "#/components/schemas/UserDetail" }
        temporaryPassword: { type: string, example: "Tmp#9aK2$x" }

    UpdateUserStatusRequest:
      type: object
      required: [status]
      properties:
        status: { type: integer, enum: [0, 1, 2], description: "0: DEACTIVATED, 1: ACTIVE, 2: LOCKED" }
        reason: { type: string, nullable: true, example: "Nghỉ việc chuyển công tác" }

    UpdateUserRoleRequest:
      type: object
      required: [role]
      properties:
        role: { $ref: "#/components/schemas/RoleName" }

    ResetPasswordResponse:
      type: object
      required: [userId, email, temporaryPassword]
      properties:
        userId: { type: integer, format: int64 }
        email: { type: string }
        temporaryPassword: { type: string, example: "Rst#4mP9!z" }

    # ------------------------------ Units ---------------------------------

    UnitAvailability:
      type: string
      enum: [AVAILABLE, AVAILABLE_SOON]
      description: "AVAILABLE_SOON = đang trong turnover buffer — hiển thị 'Available {date} · cleaning buffer'"

    UnitSummary:
      type: object
      required: [id, code, typeName, sizeM2, baseDailyRent, availability]
      properties:
        id: { type: integer, format: int64 }
        code: { type: string, example: S-3 }
        typeName: { type: string, example: Indoor }
        sizeM2: { type: number, example: 5 }
        floor: { type: integer }
        zoneCode: { type: string, example: B }
        facilityName: { type: string, example: Tân Bình Depot }
        accessType: { type: string, example: PIN }
        baseDailyRent: { type: integer, description: "Đơn giá thuê/ngày theo Policy active (VND) — dùng cho sort giá", example: 5000 }
        availability:
          type: object
          properties:
            status: { $ref: "#/components/schemas/UnitAvailability" }
            availableFromDate: { type: string, format: date, nullable: true, description: "Ngày sớm nhất thuê được (buffer áp dụng)" }
        photoUrl: { type: string, example: "/units/S-3.jpg" }

    UnitDetail:
      allOf:
        - $ref: "#/components/schemas/UnitSummary"
        - type: object
          required: [dimensions, security, photoUrls]
          properties:
            dimensions: { type: string, example: "2.0 × 2.5 × 2.2 m" }
            security: { type: string, example: "CCTV 24/7 + khóa thông minh" }
            photoUrls:
              type: array
              items: { type: string }

    UnitPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/UnitSummary" }
        page: { type: integer, example: 1 }
        pageSize: { type: integer, example: 25 }
        total: { type: integer, example: 6 }

    # ------------------------------ Quote (AD-11) -------------------------

    QuoteLineKind:
      type: string
      enum: [RENT, SURCHARGE, DISCOUNT, DEPOSIT]
      description: "DISCOUNT = FR-40 (P2) — Sprint 1 chưa dùng, giữ enum ổn định wire format"

    QuoteLine:
      type: object
      required: [kind, label, amount]
      properties:
        kind: { $ref: "#/components/schemas/QuoteLineKind" }
        code: { type: string, description: "Mã rule policy (RENT_RATE, SURCHARGE_…, DEPOSIT_RATE)", example: RENT_RATE }
        label: { type: string, example: "Rent 345.000 ₫ × 3 months" }
        amount: { type: integer, description: "VND, số nguyên" }
        refundable: { type: boolean, default: false }

    Quote:
      type: object
      required: [unitId, startDate, endDate, durationDays, lines, totalRent, depositAmount, dueNow, policyVersion]
      properties:
        unitId: { type: integer, format: int64 }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date, description: "Server tính (inclusive)" }
        durationDays: { type: integer }
        lines:
          type: array
          items: { $ref: "#/components/schemas/QuoteLine" }
        totalRent: { type: integer, example: 1035000 }
        depositAmount: { type: integer, example: 103500 }
        dueNow: { type: integer, description: "Số phải trả ngay = deposit (booking)", example: 103500 }
        policyVersion: { type: string, example: v3 }

    # --------------------------- Reservations -----------------------------

    ReservationStatus:
      type: string
      enum: [PENDING_PAYMENT, RESERVED, CHECKED_IN, CHECKOUT_REQUESTED, CLOSED, EXPIRED]
      description: "CANCELLED dự phòng — v1 không kích hoạt (PRD §6). EXPIRED suy diễn on-read (AD-4)"

    DepositStatus:
      type: string
      enum: [HELD, FORFEITED, SETTLED]

    ReservationSummary:
      type: object
      required: [id, code, status, unit, startDate, endDate, depositAmount]
      properties:
        id: { type: integer, format: int64 }
        code: { type: string, example: BK-1042 }
        status: { $ref: "#/components/schemas/ReservationStatus" }
        unit:
          type: object
          properties:
            code: { type: string, example: S-3 }
            sizeM2: { type: number }
            typeName: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        depositAmount: { type: integer }
        depositStatus:
          allOf:
            - $ref: "#/components/schemas/DepositStatus"
            - type: string
              nullable: true

    ReservationDetail:
      allOf:
        - $ref: "#/components/schemas/ReservationSummary"
        - type: object
          required: [durationDays, quote, checkInDeadline, payments, contracts]
          properties:
            durationDays: { type: integer }
            quote:
              allOf:
                - $ref: "#/components/schemas/Quote"
              description: "Snapshot tại Booking Summary (AD-11) — mọi dòng tiền sau này đọc từ đây"
            checkInDeadline: { type: string, format: date, description: "Hết ngày này chưa check-in → EXPIRED, mất cọc" }
            depositForfeitReason:
              type: string
              nullable: true
              example: "Deposit forfeited — no-show"
              description: "Set khi depositStatus=FORFEITED (receipt no-show hiển thị trên detail)"
            accessCode:
              type: string
              nullable: true
              description: "SensitiveValue — chỉ trả trong detail của chủ reservation, chỉ sau khi contract có ảnh ký (AD-5)"
            payments:
              type: array
              items: { $ref: "#/components/schemas/PaymentRecord" }
            contracts:
              type: array
              items: { $ref: "#/components/schemas/ContractChainItem" }
            latestNewCheckout:
              type: string
              format: date
              nullable: true
              description: "US-18 (FR-16): ngày trả muộn nhất được phép khi gia hạn = start của reservation kế tiếp trên cùng unit − 1; null khi không CHECKED_IN hoặc unit trống phía sau"

    ReservationPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ReservationSummary" }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }

    CreateCheckoutRequest:
      type: object
      required: [requestedDate]
      properties:
        requestedDate:
          type: string
          format: date
          example: "2026-10-25"
        timeSlot:
          type: string
          enum: [MORNING, AFTERNOON, EVENING]
          example: "MORNING"
        reason:
          type: string
          nullable: true
          example: "EXPIRED_NEED"

    CheckoutRequestResponse:
      type: object
      properties:
        requestId:
          type: integer
          format: int64
          example: 1
        reservationId:
          type: integer
          format: int64
          example: 10
        requestedDate:
          type: string
          format: date
          example: "2026-10-25"
        timeSlot:
          type: string
          nullable: true
          example: "MORNING"
        reason:
          type: string
          nullable: true
          example: "EXPIRED_NEED"
        status:
          type: string
          example: "PENDING"
        createdAt:
          type: string
          format: date-time
        reservationStatus:
          type: string
          example: "CHECKOUT_REQUESTED"
        taskId:
          type: integer
          format: int64
          nullable: true
          example: 105
        notification:
          $ref: "#/components/schemas/NotificationEvent"

    CancelCheckoutResponse:
      type: object
      properties:
        reservationId:
          type: integer
          format: int64
          example: 10
        reservationStatus:
          type: string
          example: "CHECKED_IN"
        notification:
          $ref: "#/components/schemas/NotificationEvent"

    # ------------------------------ Payments ------------------------------

    PaymentPurpose:
      type: string
      enum: [DEPOSIT, RENT, EXTENSION_FEE, DAMAGE_FEE, EXTRA_FEE]
      description: "BE chấp nhận DEPOSIT, RENT (US-15) và EXTENSION_FEE (US-18). DAMAGE_FEE/EXTRA_FEE thuộc sprint sau (enum đầy đủ để ổn định wire format)"

    PaymentMethod:
      type: string
      enum: [CARD, MOMO, VNPAY, PAYOS]
      description: "PAYOS là cổng thật khi backend bật PAYOS_ENABLED=true + key; CARD/MOMO/VNPAY là mock demo auto-success."

    PaymentStatus:
      type: string
      enum: [PENDING, PROCESSING, SUCCEEDED, FAILED, EXPIRED]

    PaymentSession:
      type: object
      required: [id, purpose, method, amount, status, createdAt]
      properties:
        id: { type: integer, format: int64 }
        reservationId: { type: integer, format: int64, nullable: true, description: "null khi payment còn gắn booking draft; có giá trị sau khi SUCCEEDED" }
        purpose: { $ref: "#/components/schemas/PaymentPurpose" }
        method: { $ref: "#/components/schemas/PaymentMethod" }
        amount: { type: integer, example: 103500 }
        status: { $ref: "#/components/schemas/PaymentStatus" }
        otpRequired: { type: boolean, description: "true khi MOMO chờ OTP" }
        otpExpiresAt: { type: string, format: date-time, nullable: true, description: "Hạn nhập OTP (MOMO) — quá hạn → EXPIRED, PAYMENT_EXPIRED" }
        qrPayload: { type: string, nullable: true, description: "Nội dung QR (VNPAY mock hoặc VietQR PayOS) — FE render QR" }
        qrCode: { type: string, nullable: true, description: "Chuỗi VietQR động PayOS trả về khi method=PAYOS; demo = null" }
        checkoutUrl: { type: string, nullable: true, description: "Trang thanh toán PayOS (chỉ method=PAYOS) — FE mở tab mới" }
        qrExpiresAt: { type: string, format: date-time, nullable: true, description: "~5 phút (server quyết)" }
        receiptCode: { type: string, nullable: true, description: "Sinh khi SUCCEEDED" }
        paidAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    PaymentRecord:
      type: object
      required: [id, reservationId, purpose, method, amount, status]
      properties:
        id: { type: integer, format: int64 }
        reservationId: { type: integer, format: int64, description: "Map receipt về rental ngay trong list không filter (FR-9)" }
        receiptCode: { type: string, nullable: true, example: RC-2026-0042, description: "Sinh khi SUCCEEDED — receipt xem vĩnh viễn (FR-9)" }
        purpose: { $ref: "#/components/schemas/PaymentPurpose" }
        method: { $ref: "#/components/schemas/PaymentMethod" }
        amount: { type: integer }
        status: { $ref: "#/components/schemas/PaymentStatus" }
        paidAt: { type: string, format: date-time, nullable: true }

    PaymentPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PaymentRecord" }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }

    NotificationEvent:
      type: object
      description: "Kèm trong response của mutation thành công — FE bắn toast từ đây (Conventions); bản ghi bell sinh cùng transaction"
      properties:
        type: { $ref: "#/components/schemas/NotificationType" }
        title: { type: string, example: "Booking confirmed — S-3 reserved" }
        body: { type: string, nullable: true, example: "Deposit 103.500 ₫ đã nhận. Check-in pass sẵn sàng." }
        deepLink: { type: string, example: /rentals/1042 }

    PaymentResult:
      type: object
      required: [payment, reservation]
      properties:
        payment: { $ref: "#/components/schemas/PaymentRecord" }
        receipt:
          type: object
          nullable: true
          properties:
            receiptCode: { type: string }
            amount: { type: integer }
            paidAt: { type: string, format: date-time }
        reservation:
          allOf:
            - $ref: "#/components/schemas/ReservationDetail"
          description: "Trạng thái sau flip (RESERVED / CHECKED_IN...)"
        contract:
          allOf:
            - $ref: "#/components/schemas/ContractChainItem"
            - type: object
              nullable: true
          description: "Auto-draft khi purpose=DEPOSIT thành công (FR-10)"
        notification:
          allOf:
            - $ref: "#/components/schemas/NotificationEvent"
            - type: object
              nullable: true

          description: "Chỉ có khi thanh toán THÀNH CÔNG — thất bại không sinh notification (FAIL tile: No money was taken)"

    PayOsWebhook:
      type: object
      description: "Payload PayOS POST về webhook — verify bằng SDK trước khi đọc data."
      required: [code, data, signature]
      properties:
        code: { type: string, example: "00" }
        desc: { type: string, example: "success" }
        success: { type: boolean }
        signature: { type: string, description: "HMAC-SHA256 của data bằng PAYOS_CHECKSUM_KEY" }
        data:
          type: object
          properties:
            orderCode: { type: integer, format: int64, description: "Base + paymentId do backend sinh" }
            amount: { type: integer, format: int64 }
            description: { type: string }
            accountNumber: { type: string }
            reference: { type: string }
            transactionDateTime: { type: string }
            currency: { type: string, example: VND }
            paymentLinkId: { type: string }
            code: { type: string, example: "00" }
            desc: { type: string }
          additionalProperties: true
      additionalProperties: true

    # ------------------------------ Contracts -----------------------------

    ContractStatus:
      type: string
      enum: [DRAFT, PRINTED, SIGNED, ACTIVE, CLOSED, SUPERSEDED]

    ContractKind:
      type: string
      enum: [ORIGINAL, ADDENDUM]

    ContractChainItem:
      type: object
      required: [id, code, kind, status, isLatest]
      properties:
        id: { type: integer, format: int64 }
        code: { type: string, example: CT-1042 }
        kind: { $ref: "#/components/schemas/ContractKind" }
        status: { $ref: "#/components/schemas/ContractStatus" }
        isLatest: { type: boolean, description: "Chuỗi 1—N: đúng một bản IsLatest" }
        signedPhotoUrl: { type: string, nullable: true, example: "/api/v1/attachments/1", description: "Endpoint /attachments thuộc Sprint 2 — URL giữ shape trước, chưa khai báo trong contract này" }
        signatureDueDate: { type: string, format: date, nullable: true, description: "Chỉ ADDENDUM — hạn ký tại quầy 7 ngày" }

    ContractDetail:
      allOf:
        - $ref: "#/components/schemas/ContractChainItem"
        - type: object
          required: [reservationId, policyVersion, contentSnapshot, createdAt]
          properties:
            reservationId: { type: integer, format: int64 }
            policyVersion: { type: string, example: v3 }
            contentSnapshot:
              type: string
              description: "Snapshot điều khoản lúc draft — FE render print view từ đây (Contract print, không PDF service)"
            createdAt: { type: string, format: date-time }

    ContractAddendumStatus:
      type: string
      enum: [AWAITING_SIGNATURE, SIGNED, EXPIRED, VOIDED]

    ContractAddendumSignRequest:
      type: object
      required: [signedPhotoUrl]
      properties:
        signedPhotoUrl:
          type: string
          example: "https://storagehub.com/uploads/addendum-1042-a1.jpg"
          description: "URL ảnh chụp bản phụ lục giấy có chữ ký khách tại quầy (bắt buộc)"
        notes:
          type: string
          nullable: true
          example: "Ký tại quầy ca sáng"

    ContractAddendumResponse:
      type: object
      required: [addendumId, contractId, code, status, signatureDueDate, createdAt]
      properties:
        addendumId: { type: integer, format: int64 }
        contractId: { type: integer, format: int64 }
        extensionId: { type: integer, format: int64, nullable: true }
        code: { type: string, example: "CT-1042-A1" }
        contentSnapshot: { type: string }
        signedPhotoUrl: { type: string, nullable: true }
        signatureDueDate: { type: string, format: date }
        status: { $ref: "#/components/schemas/ContractAddendumStatus" }
        createdAt: { type: string, format: date-time }

    ContractChainResponse:
      type: object
      required: [contract, addendums]
      properties:
        contract: { $ref: "#/components/schemas/ContractDetail" }
        addendums:
          type: array
          items: { $ref: "#/components/schemas/ContractAddendumResponse" }

    # ---------------------------- Notifications ---------------------------

    NotificationType:
      type: string
      enum: [RESERVATION_CONFIRMED, PAYMENT_SUCCEEDED, CONTRACT_DRAFTED, RESERVATION_EXPIRED, CHECK_IN_COMPLETED, EXTENSION_APPLIED, ADDENDUM_AWAITING_SIGNATURE, CHECKOUT_REQUESTED, CHECKOUT_REQUEST_CANCELLED]
      description: "Deep-link registry: contracts/routes.yaml (AD-6). CHECK_IN_COMPLETED (US-15), EXTENSION_APPLIED + ADDENDUM_AWAITING_SIGNATURE (US-18), CHECKOUT_REQUESTED + CHECKOUT_REQUEST_CANCELLED (US-20)"

    Notification:
      type: object
      required: [id, type, title, isRead, createdAt]
      properties:
        id: { type: integer, format: int64 }
        type: { $ref: "#/components/schemas/NotificationType" }
        title: { type: string }
        body: { type: string, nullable: true, description: "Dòng phụ dưới title (bell 2 dòng); có thể null" }
        deepLink: { type: string, nullable: true }
        isRead: { type: boolean }
        createdAt: { type: string, format: date-time }

    NotificationPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Notification" }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }

    # ------------------------------- Tasks (FR-21/22) ---------------------

    TaskType:
      type: string
      enum: [CHECK_IN, CHECKOUT, CLEANING, SUPPORT, CONTRACT]
      description: "5 loại thẻ kanban theo FR-21 / StateChart-6"

    TaskStatus:
      type: string
      enum: [TODO, IN_PROGRESS, DONE]
      description: "3 cột kanban theo FR-21: To do / In progress / Done"

    TaskCard:
      type: object
      required: [taskId, type, status, workDate, assignedStaff]
      properties:
        taskId: { type: integer, format: int64 }
        type: { $ref: "#/components/schemas/TaskType" }
        status: { $ref: "#/components/schemas/TaskStatus" }
        refCode: { type: string, nullable: true, example: "BK-1042" }
        unitCode: { type: string, nullable: true, example: "Unit S-3" }
        customerName: { type: string, nullable: true, example: "Nguyễn Thị Lan" }
        customerPhone: { type: string, nullable: true, example: "0901 234 567" }
        dueTime: { type: string, nullable: true, example: "09:00" }
        workDate: { type: string, format: date, example: "2026-10-13" }
        shift: { type: string, enum: [MORNING, AFTERNOON, EVENING], example: "MORNING" }
        accessPin: { type: string, nullable: true, example: "8842-Active" }
        rentAmount: { type: integer, format: int64, nullable: true, example: 1800000 }
        depositPaid: { type: integer, format: int64, nullable: true, example: 180000 }
        priority: { type: string, nullable: true, example: "Medium" }
        issueDescription: { type: string, nullable: true }
        alertNote: { type: string, nullable: true }
        assignedStaff:
          type: object
          required: [staffId, fullName]
          properties:
            staffId: { type: integer, format: int64 }
            fullName: { type: string }
        ritual:
          type: object
          nullable: true
          properties:
            depositVerified: { type: boolean }
            rentCollected: { type: boolean }
            contractSigned: { type: boolean }
            contractPhotoUrl: { type: string, nullable: true }
            accessCodeHanded: { type: boolean }
            settlementConfirmed: { type: boolean }
            receiptPrinted: { type: boolean }
            readyForTenant: { type: boolean }
            resolvedNote: { type: string, nullable: true }
            escalated: { type: boolean }
            escalationReason: { type: string, nullable: true }

    UpdateTaskStatusRequest:
      type: object
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/TaskStatus" }

    CreateTaskRequest:
      type: object
      required: [type]
      description: "Hệ thống tự động xác định assignedStaff qua Zone và shift của Unit; cấm gán thủ công."
      properties:
        type: { $ref: "#/components/schemas/TaskType" }
        unitId: { type: integer, format: int64, nullable: true }
        refCode: { type: string, nullable: true }
        workDate: { type: string, format: date, nullable: true }
        shift: { type: string, enum: [MORNING, AFTERNOON, EVENING], nullable: true }
        dueTime: { type: string, nullable: true }
        priority: { type: string, nullable: true }
        alertNote: { type: string, nullable: true }
        issueDescription: { type: string, nullable: true }

    # ------------------------------- Reports (FR-31) ----------------------

    FinancialSummary:
      type: object
      required: [periodLabel, grossRevenue, grossRevenueGrowth, netRevenue, escrowDeposit, escrowDepositNote, surchargeRevenue, surchargeNote, occupancyRate, occupancyBreakdown, occupancyGrowth]
      properties:
        periodLabel: { type: string, example: "Quý này (Q3 2026)" }
