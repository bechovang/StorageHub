        escrowDeposit: { type: integer, format: int64, example: 4890000, description: "Tiền cọc an ninh ký quỹ — tuyệt đối KHÔNG tính vào doanh thu" }
        escrowDepositNote: { type: string, example: "Tài khoản giữ hộ cọc tại Vietcombank — Tách biệt 100% khỏi doanh thu kinh doanh" }
        surchargeRevenue: { type: integer, format: int64, example: 1240000, description: "Tổng phụ thu phát sinh" }
        surchargeNote: { type: string, example: "Bao gồm phí quá giờ, điện lạnh và xử lý rác" }
