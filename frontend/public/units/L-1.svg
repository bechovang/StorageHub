<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="doorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="50%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <pattern id="slats" width="100" height="20" patternUnits="userSpaceOnUse">
      <line x1="0" y1="19" x2="100" y2="19" stroke="#000000" stroke-width="1.2" opacity="0.35"/>
      <line x1="0" y1="20" x2="100" y2="20" stroke="#ffffff" stroke-width="0.8" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background Warehouse Room -->
  <rect width="800" height="600" fill="url(#wallGrad)"/>
  
  <!-- Floor Grid (Perspective) -->
  <polygon points="0,480 800,480 800,600 0,600" fill="#cbd5e1"/>
  <line x1="0" y1="480" x2="800" y2="480" stroke="#94a3b8" stroke-width="3"/>
  <line x1="150" y1="480" x2="50" y2="600" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="300" y1="480" x2="250" y2="600" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="500" y1="480" x2="550" y2="600" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="650" y1="480" x2="750" y2="600" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Concrete Unit Frame (Swiss Grid Heavy Outline) -->
  <rect x="120" y="60" width="560" height="420" fill="#334155" stroke="#0f172a" stroke-width="4"/>
  <rect x="140" y="80" width="520" height="400" fill="#1e293b"/>

  <!-- Roll-up Metal Door -->
  <rect x="160" y="140" width="480" height="340" fill="url(#doorGrad)"/>
  <rect x="160" y="140" width="480" height="340" fill="url(#slats)"/>
  <rect x="160" y="140" width="480" height="340" fill="none" stroke="#000000" stroke-width="3"/>

  <!-- Door Header Box (Cụm cuốn cửa) -->
  <rect x="140" y="80" width="520" height="60" fill="#0f172a" stroke="#000000" stroke-width="2"/>
  
  <!-- Signage & Unit Code Badge -->
  <rect x="170" y="94" width="130" height="34" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="235" y="118" font-family="'SFMono-Regular', Consolas, monospace" font-size="20" font-weight="900" fill="#000000" text-anchor="middle" letter-spacing="1">L-1</text>

  <!-- Zone & Spec Badge -->
  <rect x="315" y="97" width="90" height="28" fill="#dc2626"/>
  <text x="360" y="116" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">ZONE B</text>

  <rect x="420" y="97" width="110" height="28" fill="#f8fafc" stroke="#64748b" stroke-width="1"/>
  <text x="475" y="116" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">15.0 m²</text>

  <!-- Smart Access Reader / Padlock Box -->
  <rect x="580" y="270" width="36" height="56" fill="#020617" stroke="#38bdf8" stroke-width="1.5" rx="2"/>
  <circle cx="598" cy="285" r="4" fill="#22c55e"/>
  <rect x="588" y="296" width="20" height="2" fill="#38bdf8"/>
  <rect x="588" y="302" width="20" height="2" fill="#38bdf8"/>
  <rect x="588" y="308" width="20" height="2" fill="#38bdf8"/>

  <!-- Heavy Duty Bottom Handle Bar -->
  <rect x="300" y="455" width="200" height="18" fill="#475569" stroke="#000000" stroke-width="2"/>
  <rect x="370" y="445" width="60" height="10" fill="#0f172a"/>

  <!-- Info Strip Bottom Overlay -->
  <rect x="120" y="500" width="560" height="45" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="145" y="528" font-family="'Inter', sans-serif" font-size="15" font-weight="800" fill="#000000">STORAGEHUB · Kho lớn (L)</text>
  <text x="660" y="528" font-family="'SFMono-Regular', Consolas, monospace" font-size="13" font-weight="700" fill="#dc2626" text-anchor="end">PALLET DOCK · 24/7 SECURE</text>
</svg>