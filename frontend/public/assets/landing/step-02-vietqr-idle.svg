<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="100%" height="100%" fill="none">
  <defs>
    <style>
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      .sans { font-family: 'Inter Tight', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
  </defs>

  <!-- Technical Background Grid Points -->
  <g fill="#d4d4d8">
    <circle cx="24" cy="30" r="1.5" />
    <circle cx="240" cy="30" r="1.5" />
    <circle cx="456" cy="30" r="1.5" />
    <circle cx="24" cy="240" r="1.5" />
    <circle cx="456" cy="240" r="1.5" />
  </g>

  <!-- Header Metadata -->
  <text x="24" y="24" class="mono" font-size="9" font-weight="700" fill="#71717a" letter-spacing="1">STEP 02 // INSTANT CHECKOUT · VIETQR DYNAMIC</text>
  <rect x="340" y="14" width="116" height="15" fill="#18181b" />
  <text x="398" y="25" text-anchor="middle" class="mono" font-size="8.5" font-weight="800" fill="#ffffff" letter-spacing="0.5">10% CỌC GIỮ CHỖ</text>

  <!-- MAIN CARD CONTAINER (SPLIT 2 COLUMNS: QR CODE + TRANSFER DATA) -->
  <g id="qr-checkout" transform="translate(24, 42)">
    <!-- Main Chassis Border -->
    <rect x="0" y="0" width="432" height="180" fill="#ffffff" stroke="#18181b" stroke-width="1.75" />
    
    <!-- LEFT COLUMN: VIETQR CODE FRAME (x: 16, y: 16, size: 148x148) -->
    <rect x="16" y="16" width="148" height="148" fill="#fafafa" stroke="#e4e4e7" stroke-width="1.2" />
    
    <!-- Corner Targeting Brackets for Scanner -->
    <path d="M22 36 V22 H36" stroke="#18181b" stroke-width="2.5" fill="none" />
    <path d="M158 36 V22 H144" stroke="#18181b" stroke-width="2.5" fill="none" />
    <path d="M22 144 V158 H36" stroke="#18181b" stroke-width="2.5" fill="none" />
    <path d="M158 144 V158 H144" stroke="#18181b" stroke-width="2.5" fill="none" />

    <!-- Vector QR Code Pattern Elements (High Detail) -->
    <!-- Top-Left Finder -->
    <rect x="32" y="32" width="30" height="30" fill="none" stroke="#18181b" stroke-width="3" />
    <rect x="39" y="39" width="16" height="16" fill="#18181b" />

    <!-- Top-Right Finder -->
    <rect x="118" y="32" width="30" height="30" fill="none" stroke="#18181b" stroke-width="3" />
    <rect x="125" y="39" width="16" height="16" fill="#18181b" />

    <!-- Bottom-Left Finder -->
    <rect x="32" y="118" width="30" height="30" fill="none" stroke="#18181b" stroke-width="3" />
    <rect x="39" y="125" width="16" height="16" fill="#18181b" />

    <!-- QR Data Blocks (Matrix Layout) -->
    <g fill="#18181b">
      <rect x="70" y="32" width="6" height="6" />
      <rect x="82" y="32" width="12" height="6" />
      <rect x="100" y="32" width="6" height="6" />
      <rect x="70" y="44" width="12" height="6" />
      <rect x="94" y="44" width="12" height="6" />
      <rect x="76" y="56" width="6" height="12" />
      <rect x="94" y="56" width="6" height="6" />
      <rect x="106" y="56" width="6" height="6" />

      <!-- Center Logo Mask -->
      <rect x="76" y="76" width="28" height="28" fill="#18181b" />
      <rect x="78" y="78" width="24" height="24" fill="#ffffff" />
      <polygon points="84,83 96,83 90,97" fill="#dc2626" />

      <!-- Bottom Right Data Blocks -->
      <rect x="70" y="112" width="12" height="6" />
      <rect x="94" y="112" width="18" height="6" />
      <rect x="124" y="112" width="6" height="12" />
      <rect x="136" y="112" width="12" height="6" />
      <rect x="76" y="124" width="6" height="18" />
      <rect x="94" y="124" width="12" height="6" />
      <rect x="118" y="124" width="6" height="6" />
      <rect x="130" y="124" width="12" height="12" />
      <rect x="88" y="136" width="18" height="6" />
      <rect x="112" y="136" width="12" height="6" />
      <rect x="70" y="142" width="6" height="6" />
      <rect x="136" y="142" width="6" height="6" />
    </g>

    <!-- RIGHT COLUMN: FINANCIAL DETAILS & BANK TRANSFER BREAKDOWN -->
    <g transform="translate(180, 16)">
      <!-- Header / Payment Network -->
      <text x="0" y="14" class="mono" font-size="8" font-weight="700" fill="#71717a">NETWORK: NAPAS 24/7 · MB BANK</text>
      <text x="240" y="14" text-anchor="end" class="mono" font-size="8" font-weight="800" fill="#dc2626">KHỚP LỆNH TỨC THÌ</text>

      <line x1="0" y1="24" x2="240" y2="24" stroke="#e4e4e7" stroke-width="1" />

      <!-- Spec Lines -->
      <text x="0" y="44" class="mono" font-size="8.5" font-weight="600" fill="#71717a">TÀI KHOẢN NHẬN:</text>
      <text x="240" y="44" text-anchor="end" class="mono" font-size="9" font-weight="800" fill="#18181b">1028 8899 001</text>

      <text x="0" y="66" class="mono" font-size="8.5" font-weight="600" fill="#71717a">ĐỐI TƯỢNG:</text>
      <text x="240" y="66" text-anchor="end" class="mono" font-size="9" font-weight="800" fill="#18181b">KHO 204 · 8.0 M²</text>

      <text x="0" y="88" class="mono" font-size="8.5" font-weight="600" fill="#71717a">NỘI DUNG CK:</text>
      <rect x="120" y="76" width="120" height="16" fill="#f4f4f5" />
      <text x="180" y="88" text-anchor="middle" class="mono" font-size="8" font-weight="800" fill="#18181b">SHUB 204 DEPOSIT</text>

      <line x1="0" y1="104" x2="240" y2="104" stroke="#e4e4e7" stroke-width="1" />

      <!-- Total 10% Deposit Amount -->
      <text x="0" y="126" class="mono" font-size="8.5" font-weight="700" fill="#18181b">TIỀN CỌC (10%):</text>
      <text x="240" y="128" text-anchor="end" class="sans" font-size="18" font-weight="900" fill="#dc2626">38.000 <tspan font-size="12" font-family="'SFMono-Regular', monospace">Đ</tspan></text>

      <!-- Status Indicator Pill -->
      <rect x="0" y="136" width="240" height="18" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1" />
      <circle cx="12" cy="145" r="3.5" fill="#eab308" />
      <text x="22" y="148" class="mono" font-size="7.5" font-weight="700" fill="#71717a">CHỜ THANH TOÁN (HẾT HẠN TRONG 15:00)</text>
    </g>
  </g>

  <!-- Technical Axis Markers -->
  <line x1="24" y1="235" x2="456" y2="235" stroke="#e4e4e7" stroke-width="1" />
  <text x="24" y="252" class="mono" font-size="8.5" font-weight="600" fill="#71717a">STANDARD: EMVCO VIETQR COMPLIANT · ESCROW 10%</text>
  <text x="456" y="252" text-anchor="end" class="mono" font-size="8.5" font-weight="700" fill="#18181b">[ MỞ APP NGÂN HÀNG &amp; QUÉT MÃ ]</text>
</svg>