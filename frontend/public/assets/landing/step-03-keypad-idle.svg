  <text x="24" y="252" class="mono" font-size="8.5" font-weight="600" fill="#71717a">ENCRYPTION: HARDWARE ENCLAVE AES-256 · LOG: REALTIME</text>
  <text x="456" y="252" text-anchor="end" class="mono" font-size="8.5" font-weight="700" fill="#18181b">[ RÊ CHUỘT ĐỂ MÔ PHỎNG NHẬP PIN ]</text>
</svg>