      <circle cx="16" cy="135" r="4.5" fill="#eab308" />
      <text x="28" y="131" class="mono" font-size="8.5" font-weight="800" fill="#18181b">CỬA KHO ĐANG KHÓA AN TOÀN</text>
      <text x="28" y="144" class="mono" font-size="7" font-weight="600" fill="#71717a">NHẬP MÃ PIN 6 SỐ TẠI BÀN PHÍM ĐỂ MỞ CỬA</text>
