      <text x="28" y="112" class="mono" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">7</text>

      <rect x="51" y="98" width="32" height="20" fill="#27272a" stroke="#3f3f46" stroke-width="1" />
      <text x="67" y="112" class="mono" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">8</text>

      <rect x="90" y="98" width="32" height="20" fill="#27272a" stroke="#3f3f46" stroke-width="1" />
      <text x="106" y="112" class="mono" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">9</text>

      <!-- Row 4: *, 0, # -->
      <rect x="12" y="122" width="32" height="20" fill="#27272a" stroke="#3f3f46" stroke-width="1" />
      <text x="28" y="136" class="mono" font-size="11" font-weight="800" fill="#a1a1aa" text-anchor="middle">*</text>

      <rect x="51" y="122" width="32" height="20" fill="#27272a" stroke="#3f3f46" stroke-width="1" />
      <text x="67" y="136" class="mono" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">0</text>

      <rect x="90" y="122" width="32" height="20" fill="#27272a" stroke="#3f3f46" stroke-width="1" />
      <text x="106" y="136" class="mono" font-size="11" font-weight="800" fill="#a1a1aa" text-anchor="middle">#</text>
