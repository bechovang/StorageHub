<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="100%" height="100%" fill="none">
  <defs>
    <style>
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      .sans { font-family: 'Inter Tight', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
  </defs>

  <!-- Technical Background Grid Points -->
  <g fill="#d4d4d8">
    <circle cx="24" cy="30" r="1.5" />
    <circle cx="240" cy="30" r="1.5" />
    <circle cx="456" cy="30" r="1.5" />
    <circle cx="24" cy="240" r="1.5" />
