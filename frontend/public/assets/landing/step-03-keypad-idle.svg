      <rect x="12" y="74" width="32" height="20" fill="#27272a" stroke="#3f3f46" stroke-width="1" />
      <text x="28" y="88" class="mono" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">4</text>

      <rect x="51" y="74" width="32" height="20" fill="#27272a" stroke="#3f3f46" stroke-width="1" />
      <text x="67" y="88" class="mono" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">5</text>

      <rect x="90" y="74" width="32" height="20" fill="#27272a" stroke="#3f3f46" stroke-width="1" />
      <text x="106" y="88" class="mono" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">6</text>

