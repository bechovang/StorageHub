      <text x="0" y="126" class="mono" font-size="8" font-weight="700" fill="#18181b">KHO: KHO 204 (TẦNG 2)</text>
      <text x="240" y="126" text-anchor="end" class="mono" font-size="8" font-weight="800" fill="#16a34a">HỢP ĐỒNG: SHUB-8849</text>

      <!-- Active Pass Badge -->
      <rect x="0" y="136" width="240" height="18" fill="#dcfce7" stroke="#86efac" stroke-width="1" />
      <circle cx="12" cy="145" r="3.5" fill="#16a34a" />
      <text x="22" y="148" class="mono" font-size="7.5" font-weight="800" fill="#15803d">CHECK-IN PASS ĐÃ KÍCH HOẠT · CÓ THỂ ĐẾN KHO NGAY</text>
    </g>
  </g>

  <!-- Technical Axis Markers (Active Red) -->
  <line x1="24" y1="235" x2="456" y2="235" stroke="#16a34a" stroke-width="1.5" />
  <text x="24" y="252" class="mono" font-size="8.5" font-weight="700" fill="#16a34a">TRẠNG THÁI: CỌC 10% THÀNH CÔNG · HỢP ĐỒNG ĐÃ LƯU TRỮ</text>
  <text x="456" y="252" text-anchor="end" class="mono" font-size="8.5" font-weight="800" fill="#18181b">[ BƯỚC TIẾP THEO: MỞ CỬA 24/7 BẰNG MÃ PIN ]</text>
</svg>