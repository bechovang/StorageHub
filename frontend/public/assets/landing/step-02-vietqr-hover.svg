      <text x="120" y="16" text-anchor="middle" class="mono" font-size="8.5" font-weight="800" fill="#ffffff">✓ ĐÃ XÁC NHẬN CỌC 38.000 Đ</text>

      <!-- Instant 6-digit PIN Box Header -->
      <text x="0" y="44" class="mono" font-size="8.5" font-weight="700" fill="#71717a">MÃ PIN ĐIỆN TỬ RIÊNG CỦA BẠN:</text>

      <!-- GIANT 6-DIGIT PIN CODE PILL -->
      <rect x="0" y="52" width="240" height="48" fill="#18181b" stroke="#16a34a" stroke-width="2" />
      
      <!-- 6 Monospace Key Blocks -->
      <g transform="translate(12, 60)">
        <rect x="0" y="0" width="30" height="32" fill="#27272a" />
        <text x="15" y="22" text-anchor="middle" class="mono" font-size="18" font-weight="900" fill="#ffffff">8</text>

        <rect x="36" y="0" width="30" height="32" fill="#27272a" />
        <text x="51" y="22" text-anchor="middle" class="mono" font-size="18" font-weight="900" fill="#ffffff">4</text>

        <rect x="72" y="0" width="30" height="32" fill="#27272a" />
        <text x="87" y="22" text-anchor="middle" class="mono" font-size="18" font-weight="900" fill="#ffffff">9</text>

