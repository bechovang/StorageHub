<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="100%" height="100%" fill="none">
  <defs>
    <style>
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      .sans { font-family: 'Inter Tight', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
    <!-- Laser Beam Glow Filter -->
    <filter id="laser-glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="laser-trail" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0" />
      <stop offset="70%" stop-color="#dc2626" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0.45" />
    </linearGradient>
  </defs>

  <!-- Technical Background Grid Points (Active) -->
  <g fill="#dc2626">
    <circle cx="24" cy="30" r="2" />
    <circle cx="240" cy="30" r="2" />
    <circle cx="456" cy="30" r="2" />
    <circle cx="24" cy="240" r="2" />
    <circle cx="456" cy="240" r="2" />
  </g>

  <!-- Header Metadata (Active) -->
  <text x="24" y="24" class="mono" font-size="9" font-weight="700" fill="#dc2626" letter-spacing="1">STEP 02 // INSTANT CHECKOUT · [PAYMENT VERIFIED]</text>
  <rect x="330" y="14" width="126" height="15" fill="#16a34a" />
  <text x="393" y="25" text-anchor="middle" class="mono" font-size="8.5" font-weight="800" fill="#ffffff" letter-spacing="0.5">✓ MATCHED IN 2.4s</text>

