      <text x="118" y="16" text-anchor="middle" class="mono" font-size="8.5" font-weight="800" fill="#ffffff">✓ PIN HỢP LỆ · CỬA ĐÃ MỞ (UNLOCKED)</text>

      <line x1="0" y1="32" x2="236" y2="32" stroke="#e4e4e7" stroke-width="1" />

      <!-- Specs -->
      <text x="0" y="52" class="mono" font-size="8.5" font-weight="600" fill="#71717a">ĐỐI TƯỢNG MỞ:</text>
      <text x="236" y="52" text-anchor="end" class="mono" font-size="9" font-weight="800" fill="#18181b">CỬA CHÍNH + Ô KHO 204</text>

      <text x="0" y="74" class="mono" font-size="8.5" font-weight="600" fill="#71717a">THỜI GIAN GIỮ CỬA:</text>
      <text x="236" y="74" text-anchor="end" class="mono" font-size="9" font-weight="800" fill="#16a34a">60 GIÂY TỰ ĐỘNG CHỐT</text>

      <text x="0" y="96" class="mono" font-size="8.5" font-weight="600" fill="#71717a">LỊCH SỬ RA VÀO:</text>
      <text x="236" y="96" text-anchor="end" class="mono" font-size="9" font-weight="800" fill="#18181b">LOGGED @ 17:58:24</text>

      <line x1="0" y1="110" x2="236" y2="110" stroke="#e4e4e7" stroke-width="1" />

      <!-- Unlocked Status Banner -->
      <rect x="0" y="118" width="236" height="42" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
      <circle cx="16" cy="139" r="5" fill="#16a34a" />
      <text x="28" y="135" class="mono" font-size="8.5" font-weight="900" fill="#15803d">CHÀO MỪNG BẠN ĐẾN KHO 204</text>
      <text x="28" y="148" class="mono" font-size="7" font-weight="700" fill="#166534">HỆ THỐNG ĐÃ MỞ CHỐT TỪ CÔNG NGHIỆP</text>
    </g>
  </g>

  <!-- Technical Axis Markers (Active) -->
  <line x1="24" y1="235" x2="456" y2="235" stroke="#16a34a" stroke-width="1.5" />
  <text x="24" y="252" class="mono" font-size="8.5" font-weight="700" fill="#16a34a">CHỐT TỪ: UNLATCHED · CAMERA AI: RECOGNIZED PASS</text>
  <text x="456" y="252" text-anchor="end" class="mono" font-size="8.5" font-weight="800" fill="#15803d">[ HOÀN TẤT CHECK-IN THÀNH CÔNG ]</text>
</svg>