<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="100%" height="100%" fill="none">
  <defs>
    <style>
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      .sans { font-family: 'Inter Tight', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
    <!-- Screen & Beacon Glow -->
    <filter id="green-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Technical Background Grid Points (Active Green) -->
  <g fill="#16a34a">
    <circle cx="24" cy="30" r="2" />
    <circle cx="240" cy="30" r="2" />
    <circle cx="456" cy="30" r="2" />
    <circle cx="24" cy="240" r="2" />
    <circle cx="456" cy="240" r="2" />
  </g>

  <!-- Header Metadata (Active) -->
  <text x="24" y="24" class="mono" font-size="9" font-weight="700" fill="#16a34a" letter-spacing="1">STEP 03 // 24/7 PHYSICAL ACCESS · [PIN VERIFIED · UNLOCKED]</text>
  <rect x="330" y="14" width="126" height="15" fill="#16a34a" />
  <text x="393" y="25" text-anchor="middle" class="mono" font-size="8.5" font-weight="800" fill="#ffffff" letter-spacing="0.5">ACCESS GRANTED 24/7</text>

  <!-- KEYPAD CONTAINER & TELEMETRY BREAKDOWN -->
  <g id="keypad-unit" transform="translate(24, 40)">
    <!-- Base Mounting Plate (Green Active Border) -->
    <rect x="0" y="0" width="432" height="184" fill="#ffffff" stroke="#16a34a" stroke-width="2" />

    <!-- Beacon Signal Radio Waves radiating outward -->
    <path d="M165 40 A50 50 0 0 1 165 140" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="3 3" fill="none" opacity="0.6" />
    <path d="M175 30 A65 65 0 0 1 175 150" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4 4" fill="none" opacity="0.35" />

    <!-- LEFT COLUMN: PHYSICAL KEYPAD HARDWARE (UNLOCKED STATE) -->
    <g transform="translate(20, 14)">
      <!-- Keypad Chassis -->
      <rect x="0" y="0" width="135" height="156" fill="#18181b" stroke="#16a34a" stroke-width="2" />

      <!-- Backlit OLED Display Screen (Bright Green Glow) -->
      <rect x="10" y="10" width="115" height="32" fill="#052e16" stroke="#16a34a" stroke-width="1.5" />
      
      <!-- Unlocked Padlock Icon on Screen -->
      <rect x="18" y="23" width="10" height="9" fill="#16a34a" />
      <!-- Unlocked Shackle Swung Open -->
      <path d="M20 23 V17 A3 3 0 0 1 26 17 V15" stroke="#16a34a" stroke-width="1.5" fill="none" />
      <circle cx="23" cy="27" r="1" fill="#052e16" />

      <!-- Screen Masked PIN Dots (Success) -->
      <text x="36" y="27" class="mono" font-size="8.5" font-weight="900" fill="#22c55e" filter="url(#green-glow)" letter-spacing="1">ACCESS GRANTED</text>

      <!-- 12-Key Pushbutton Matrix -->
      <!-- Row 1: 1 (PRESSED & ILLUMINATED WITH RED ACCENT), 2, 3 -->
      <rect x="12" y="50" width="32" height="20" fill="#dc2626" stroke="#ffffff" stroke-width="1.5" />
      <text x="28" y="64" class="mono" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">1</text>
      <!-- Finger touch feedback ripple -->
      <circle cx="28" cy="60" r="14" stroke="#dc2626" stroke-width="1.5" opacity="0.7" fill="none" />

      <rect x="51" y="50" width="32" height="20" fill="#27272a" stroke="#3f3f46" stroke-width="1" />
      <text x="67" y="64" class="mono" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>

      <rect x="90" y="50" width="32" height="20" fill="#27272a" stroke="#3f3f46" stroke-width="1" />
      <text x="106" y="64" class="mono" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">3</text>

      <!-- Row 2: 4, 5, 6 -->
      <rect x="12" y="74" width="32" height="20" fill="#27272a" stroke="#3f3f46" stroke-width="1" />
      <text x="28" y="88" class="mono" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">4</text>

      <rect x="51" y="74" width="32" height="20" fill="#27272a" stroke="#3f3f46" stroke-width="1" />
      <text x="67" y="88" class="mono" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">5</text>

      <rect x="90" y="74" width="32" height="20" fill="#27272a" stroke="#3f3f46" stroke-width="1" />
      <text x="106" y="88" class="mono" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">6</text>

      <!-- Row 3: 7, 8, 9 -->
      <rect x="12" y="98" width="32" height="20" fill="#27272a" stroke="#3f3f46" stroke-width="1" />
      <text x="28" y="112" class="mono" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">7</text>

      <rect x="51" y="98" width="32" height="20" fill="#27272a" stroke="#3f3f46" stroke-width="1" />
      <text x="67" y="112" class="mono" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">8</text>

      <rect x="90" y="98" width="32" height="20" fill="#27272a" stroke="#3f3f46" stroke-width="1" />
      <text x="106" y="112" class="mono" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">9</text>

      <!-- Row 4: *, 0, # -->
      <rect x="12" y="122" width="32" height="20" fill="#27272a" stroke="#3f3f46" stroke-width="1" />
      <text x="28" y="136" class="mono" font-size="11" font-weight="800" fill="#a1a1aa" text-anchor="middle">*</text>

      <rect x="51" y="122" width="32" height="20" fill="#27272a" stroke="#3f3f46" stroke-width="1" />
      <text x="67" y="136" class="mono" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">0</text>

      <rect x="90" y="122" width="32" height="20" fill="#27272a" stroke="#3f3f46" stroke-width="1" />
      <text x="106" y="136" class="mono" font-size="11" font-weight="800" fill="#a1a1aa" text-anchor="middle">#</text>
    </g>

    <!-- RIGHT COLUMN: UNLOCKED ACCESS TELEMETRY -->
    <g transform="translate(180, 16)">
      <!-- Success Badge -->
