name: deploy

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/storagehub

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Maven test
        working-directory: backend
        run: mvn -B -ntp test

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci + build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  build:
    needs: [backend-test, frontend-build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.app }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.app }}
          file: ./${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.app }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ matrix.app }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Join tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Pin image tags and deploy
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
        run: |
          set -euo pipefail
          test -n "$DOKPLOY_URL" && test -n "$DOKPLOY_API_KEY" && test -n "$DOKPLOY_COMPOSE_ID"

          base="$DOKPLOY_URL/api"
          auth=(-H "x-api-key: $DOKPLOY_API_KEY")

          one=$(curl -fsS "${auth[@]}" "$base/compose.one?composeId=$DOKPLOY_COMPOSE_ID")
          compose=$(printf '%s' "$one" | jq -r '.composeFile')
          envfile=$(printf '%s' "$one" | jq -r '.env // ""')

          # Compose phải trỏ tag bất biến, nếu không `up -d` với :latest sẽ không recreate container.
          pinned=$(printf '%s' "$compose" | sed -E "s#(storagehub/(backend|frontend)):[^[:space:]]+#\1:sha-${GITHUB_SHA}#g")
          printf '%s' "$pinned" | grep -q "sha-${GITHUB_SHA}" || { echo "pin tag failed"; exit 1; }

          payload=$(jq -n --arg id "$DOKPLOY_COMPOSE_ID" --arg cf "$pinned" --arg env "$envfile" \
            '{composeId: $id, composeFile: $cf, env: $env, sourceType: "raw", composeType: "docker-compose"}')
          curl -fsS -X POST "${auth[@]}" -H "content-type: application/json" -d "$payload" "$base/compose.update" >/dev/null

          # Deploy + xác nhận container thực sự chuyển sang image sha mới.
          ok=0
          for attempt in 1 2 3; do
            curl -fsS --max-time 120 -X POST "${auth[@]}" -H "content-type: application/json" \
              -d "{\"composeId\":\"$DOKPLOY_COMPOSE_ID\"}" "$base/compose.deploy" >/dev/null || true
            for i in $(seq 1 36); do
              st=$(curl -fsS "${auth[@]}" "$base/compose.one?composeId=$DOKPLOY_COMPOSE_ID" | jq -r '.composeStatus')
              img=$(curl -fsS "${auth[@]}" "$base/docker.getContainers" \
                | jq -r '.[] | select((.name // "") | test("storagehub-myzyte-backend")) | (.image // "")' | head -1)
              echo "rollout attempt $attempt/$i compose=$st image=$img"
              if [ "$st" = "done" ] && printf '%s' "$img" | grep -q "sha-${GITHUB_SHA}"; then
                ok=1
                break
              fi
              [ "$st" = "error" ] && break
              sleep 5
            done
            [ "$ok" = 1 ] && break
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::Rollout did not switch backend to sha-${GITHUB_SHA}"
            exit 1
          fi

      - name: Wait for application health
        run: |
          set -euo pipefail
          url="https://storagehub.phucnn.io.vn/actuator/health"
          for i in $(seq 1 48); do
            body=$(curl -fsS --max-time 10 -A "gh-actions-health" "$url" || true)
            echo "attempt $i: ${body:-<no response>}"
            if printf '%s' "$body" | grep -q '"status":"UP"'; then
              echo "application is healthy"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Application health check failed after 4 minutes"
          exit 1

  notify:
    needs: [backend-test, frontend-build, build, deploy]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Slack notify
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "SLACK_WEBHOOK_URL not set, skipping"
            exit 0
          fi

          summary=$(printf '%s' "$RESULTS" | jq -r 'to_entries | map("\(.key)=\(.value.result // "unknown")") | join("  ")')
          failed=$(printf '%s' "$RESULTS" | jq -r '[.[] | select(.result == "failure")] | length')
          if [ "$failed" -gt 0 ]; then
            icon=":x:"
            state="FAILED"
          else
            icon=":white_check_mark:"
            state="OK"
          fi

          text=$(printf '%s CI/CD %s — %s@%s (%s) by %s\n%s\n%s/%s/actions/runs/%s' \
            "$icon" "$state" "$GITHUB_REPOSITORY" "${GITHUB_SHA:0:7}" "$GITHUB_REF_NAME" "$GITHUB_ACTOR" \
            "$summary" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          payload=$(jq -n --arg t "$text" '{text: $t}')
          curl -fsS -X POST -H 'content-type: application/json' -d "$payload" "$SLACK_WEBHOOK_URL" >/dev/null
          echo "slack notified"
